<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#14171c">
<title>8-Week Lift Log</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');

:root{
  --bg:#14171c;
  --bg-card:#1b2027;
  --bg-raised:#20262e;
  --line:#2c333c;
  --text:#eef1f0;
  --text-dim:#8b95a1;
  --text-faint:#5a6470;
  --accent:#f4c430;
  --accent-dim:#8a7226;
  --steel:#5b7c99;
  --steel-dim:#33465499;
  --done:#7c9473;
  --skip:#a35a3f;
  --streak:#e08a4d;
  --long:var(--accent);
  --short:var(--steel);
  --rest:#5a6470;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{background:var(--bg);min-height:100%;}
html,body{overflow-x:hidden;width:100%;}
body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;-webkit-text-size-adjust:100%;min-height:100vh;min-height:100dvh;}
.wrap{max-width:600px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 14px calc(32px + env(safe-area-inset-bottom));}

.eyebrow{font-family:'JetBrains Mono',monospace;font-size:clamp(11px,3.2vw,12px);letter-spacing:.14em;color:var(--accent);text-transform:uppercase;margin:0 0 6px;}
h1{font-family:'Oswald',sans-serif;font-weight:700;font-size:clamp(24px,9vw,36px);text-transform:uppercase;letter-spacing:.01em;margin:0 0 4px;line-height:1.05;color:var(--text);}
.sub{color:var(--text-dim);font-size:clamp(13.5px,3.8vw,15px);line-height:1.45;margin:0 0 20px;}
.header-card{background:var(--bg-card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px;}

/* stats row: streak / level / xp */
.stats-row{display:flex;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap;}
.streak-pill{display:flex;align-items:center;gap:6px;background:var(--bg-raised);border:1px solid var(--streak);border-radius:20px;padding:7px 12px;font-family:'JetBrains Mono',monospace;font-size:clamp(11px,3vw,12px);color:var(--streak);white-space:nowrap;font-weight:700;}
.level-pill{display:flex;align-items:center;gap:6px;background:var(--bg-raised);border:1px solid var(--line);border-radius:20px;padding:7px 12px;font-family:'JetBrains Mono',monospace;font-size:clamp(11px,3vw,12px);color:var(--text);font-weight:700;white-space:nowrap;}
.xp-wrap{flex:1;min-width:110px;display:flex;flex-direction:column;gap:4px;}
.xp-track{height:8px;border-radius:5px;background:var(--line);overflow:hidden;}
.xp-fill{height:100%;border-radius:5px;background:linear-gradient(90deg,var(--accent-dim),var(--accent));transition:width .4s ease;}
.xp-label{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--text-faint);letter-spacing:.04em;}

/* road-trip map */
.road-map{position:relative;background:linear-gradient(180deg,#4a7a68 0%,#33544a 55%,#22332f 100%);border:1px solid var(--line);border-radius:20px;padding:20px 16px 18px;margin-bottom:6px;}
.road-map.expanded{padding:0;overflow:hidden;height:1860px;}
.collapsed-inner{display:flex;flex-direction:column;align-items:center;}
.scene-icon{width:140px;height:162px;border-radius:14px;box-shadow:0 8px 20px rgba(0,0,0,.4);background:var(--bg-raised);display:flex;align-items:center;justify-content:center;font-size:64px;}
.scene-icon.big{width:170px;height:196px;font-size:76px;}
.scene-icon.is-locked{opacity:.5;filter:grayscale(1) brightness(.65);}
.postcard{margin-top:10px;background:#fdf6e3;border-radius:9px;padding:8px 14px;box-shadow:0 3px 9px rgba(0,0,0,.4);text-align:center;max-width:148px;}
.postcard .pc-eyebrow{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.09em;color:#8a6d1f;font-weight:700;}
.postcard .pc-title{font-family:'Oswald',sans-serif;font-size:clamp(12px,3.4vw,14px);font-weight:600;color:#2b2013;line-height:1.22;margin-top:2px;}
.rail-row{display:flex;align-items:center;gap:10px;margin-top:16px;width:100%;max-width:320px;}
.rail{position:relative;flex:1;height:14px;background:#3f4a42;border-radius:7px;}
.rail-dash{position:absolute;top:50%;left:4%;right:4%;height:3px;transform:translateY(-50%);background:repeating-linear-gradient(90deg,var(--accent) 0 8px,transparent 8px 16px);border-radius:2px;}
.rail-car{position:absolute;top:50%;transform:translate(-50%,-50%);font-size:26px;transition:left .5s ease;filter:drop-shadow(0 4px 8px rgba(0,0,0,.5));}
.next-thumb{width:52px;height:52px;border-radius:12px;background:#2b3038;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:26px;filter:grayscale(1) brightness(.6);opacity:.7;}

.map-toggle{text-align:center;margin:10px 0 0;}
.map-toggle a{color:var(--text-dim);font-size:clamp(12px,3.3vw,13px);font-family:'JetBrains Mono',monospace;cursor:pointer;text-decoration:underline;padding:6px;display:inline-block;}

.road-svg{position:absolute;inset:0;width:100%;height:100%;}
.road-base{fill:none;stroke:#3f4a42;stroke-width:15;stroke-linecap:round;}
.road-dash{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linecap:round;stroke-dasharray:13 15;opacity:.9;}
.start-pin{position:absolute;left:50%;top:2px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;z-index:2;}
.start-label{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--text);letter-spacing:.16em;margin-top:2px;font-weight:700;}

.map-node{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;width:148px;cursor:pointer;z-index:2;}
.map-node.locked{background:#2b3038;border-radius:18px;padding:12px 6px 10px;box-shadow:inset 0 0 0 1px #3a4048;}
.scene-wrap{position:relative;width:140px;}
.node-badge{position:absolute;top:-9px;left:-9px;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Oswald',sans-serif;font-weight:700;font-size:15px;box-shadow:0 2px 6px rgba(0,0,0,.45);border-width:3px;border-style:solid;}
.node-badge.current{--glow:rgba(244,196,48,.4);animation:pulseRing 2s ease-in-out infinite;}
.map-car{position:absolute;font-size:44px;z-index:5;transition:left .6s ease, top .6s ease, transform .6s ease;filter:drop-shadow(0 8px 12px rgba(0,0,0,.55));}

.lock-message{text-align:center;font-family:'JetBrains Mono',monospace;font-size:clamp(12px,3.3vw,12.5px);color:var(--streak);margin:12px 0 14px;}

/* badges */
.badges-toggle{width:100%;background:var(--bg-card);border:1px solid var(--line);color:var(--text-dim);border-radius:10px;padding:12px 14px;font-family:'JetBrains Mono',monospace;font-size:clamp(12px,3.3vw,12.5px);text-align:left;display:flex;justify-content:space-between;align-items:center;margin:14px 0;}
.badges-panel{background:var(--bg-card);border:1px solid var(--line);border-radius:10px;padding:4px 14px;margin:-8px 0 14px;}
.badge-row{display:flex;gap:13px;align-items:flex-start;padding:13px 0;border-bottom:1px solid var(--line);}
.badge-row:last-child{border-bottom:none;}
.badge-icon{flex-shrink:0;}
.badge-name{font-weight:600;font-size:14px;}
.badge-desc{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--text-dim);margin-top:2px;}

/* per-week day strip */
.day-strip-wrap{margin-bottom:16px;}
.day-strip-label{font-family:'JetBrains Mono',monospace;font-size:clamp(11px,3vw,12px);color:var(--text-dim);margin-bottom:8px;letter-spacing:.05em;display:flex;justify-content:space-between;}
.day-strip{display:flex;gap:5px;background:var(--bg-card);padding:8px;border-radius:8px;border:1px solid var(--line);}
.dtick{flex:1;height:36px;border-radius:5px;cursor:pointer;background:var(--line);transition:transform .12s ease;}
.dtick:active{transform:scale(.94);}
.dtick.done{background:var(--done);}
.dtick.skipped{background:var(--skip);}
.dtick.type-rest{opacity:.5;}
.dtick.current{background:var(--accent);box-shadow:0 0 0 2px var(--bg-card),0 0 0 3px var(--accent);}

/* card */
.card{background:var(--bg-card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px;}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
.badge{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:clamp(10px,2.8vw,11px);letter-spacing:.1em;text-transform:uppercase;padding:4px 8px;border-radius:4px;margin-bottom:8px;}
.badge.long{background:var(--accent-dim);color:var(--accent);}
.badge.short{background:var(--steel-dim);color:var(--steel);}
.badge.rest{background:#2c333c;color:var(--text-dim);}
.day-title{font-family:'Oswald',sans-serif;font-weight:600;font-size:clamp(19px,6vw,22px);text-transform:uppercase;margin:0;letter-spacing:.01em;line-height:1.2;}
.day-meta{font-family:'JetBrains Mono',monospace;font-size:clamp(10.5px,3vw,11.5px);color:var(--text-dim);margin-top:5px;letter-spacing:.03em;}
.duration{font-family:'JetBrains Mono',monospace;font-size:clamp(15px,4.2vw,17px);color:var(--text);white-space:nowrap;text-align:right;flex-shrink:0;}
.duration small{display:block;font-size:clamp(9.5px,2.6vw,10px);color:var(--text-faint);text-transform:uppercase;letter-spacing:.06em;margin-top:2px;}

.section{margin-bottom:18px;}
.section:last-child{margin-bottom:0;}
.section-label{font-family:'JetBrains Mono',monospace;font-size:clamp(11px,3vw,12px);letter-spacing:.12em;text-transform:uppercase;color:var(--text-faint);margin-bottom:10px;}
.section-label.stretch{color:var(--steel);}
ul.ex-list{list-style:none;margin:0;padding:0;}
ul.ex-list li{display:flex;flex-direction:column;gap:4px;padding:12px 0;border-bottom:1px solid var(--line);}
ul.ex-list li:last-child{border-bottom:none;}
.ex-name{font-weight:600;color:var(--text);font-size:clamp(15px,4.2vw,16.5px);line-height:1.35;}
.ex-detail{color:var(--text-dim);font-family:'JetBrains Mono',monospace;font-size:clamp(12.5px,3.6vw,14px);line-height:1.55;}
.ex-timer{display:flex;align-items:center;gap:11px;margin-top:4px;}
.timer-btn{width:50px;height:50px;border-radius:50%;color:#0e1216;border:none;font-size:19px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;padding:0;}
.timer-time{font-family:'JetBrains Mono',monospace;font-size:clamp(14px,4vw,17px);font-weight:700;min-width:80px;}
.run-note{background:var(--bg-raised);border-left:3px solid var(--steel);padding:12px 14px;font-size:clamp(13px,3.6vw,14.5px);line-height:1.45;color:var(--text-dim);border-radius:0 8px 8px 0;margin-bottom:18px;}

.actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap;}
button{font-family:'Inter',sans-serif;font-weight:600;font-size:clamp(14px,3.8vw,15px);border:none;border-radius:9px;padding:14px 16px;min-height:48px;cursor:pointer;letter-spacing:.02em;transition:opacity .15s;-webkit-tap-highlight-color:transparent;}
button:hover{opacity:.85;}
button:active{transform:translateY(1px);opacity:.85;}
.btn-complete{background:var(--accent);color:#14171c;flex:1;min-width:130px;}
.btn-skip{background:transparent;color:var(--text-dim);border:1px solid var(--line);}
.btn-nav{background:var(--bg-raised);color:var(--text);border:1px solid var(--line);padding:12px 14px;min-height:46px;flex:1;}
.btn-jump{background:var(--steel);color:#0e1216;}
.btn-danger{background:var(--skip);color:#fff;flex:1;min-width:130px;}

.preview-banner{display:flex;flex-direction:column;align-items:stretch;gap:10px;background:var(--bg-raised);border:1px dashed var(--steel);border-radius:10px;padding:12px 14px;margin-bottom:16px;font-size:clamp(13px,3.6vw,14.5px);line-height:1.45;color:var(--text-dim);}
.preview-banner b{color:var(--text);}
.preview-banner button{width:100%;}

.done-banner{display:flex;align-items:center;gap:10px;background:var(--bg-raised);border-left:3px solid var(--done);padding:12px 14px;margin-bottom:16px;border-radius:0 8px 8px 0;font-size:clamp(13px,3.6vw,14.5px);color:var(--text-dim);}
.skip-banner{display:flex;align-items:center;gap:10px;background:var(--bg-raised);border-left:3px solid var(--skip);padding:12px 14px;margin-bottom:16px;border-radius:0 8px 8px 0;font-size:clamp(13px,3.6vw,14.5px);color:var(--text-dim);}

.finish{text-align:center;padding:32px 14px;}
.finish h2{font-family:'Oswald',sans-serif;font-size:clamp(24px,7.5vw,28px);text-transform:uppercase;color:var(--accent);margin-bottom:8px;}
.finish p{font-size:clamp(13.5px,3.8vw,15px);line-height:1.5;}

.footer-nav{display:flex;gap:10px;justify-content:space-between;margin-top:18px;}
.reset-link{text-align:center;margin-top:24px;padding-bottom:6px;}
.reset-link a{color:var(--text-faint);font-size:clamp(12.5px,3.4vw,13.5px);font-family:'JetBrains Mono',monospace;cursor:pointer;text-decoration:underline;padding:8px;display:inline-block;}
.reset-confirm{background:var(--bg-card);border:1px solid var(--skip);border-radius:12px;padding:16px;margin-top:20px;text-align:center;}
.reset-confirm p{margin:0 0 12px;font-size:clamp(13.5px,3.8vw,15px);color:var(--text);}
.reset-confirm .actions{margin-top:0;}

/* toasts / level-up / confetti */
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--bg-raised);border:2px solid var(--accent);color:var(--text);font-family:'Oswald',sans-serif;font-size:clamp(14px,4vw,16px);padding:14px 22px;border-radius:12px;z-index:999;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:88vw;text-align:center;animation:toastIn .3s ease;display:flex;align-items:center;gap:12px;justify-content:center;}
.levelup-overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(20,23,28,.9);z-index:1000;}
.levelup-card{text-align:center;animation:levelPop .5s cubic-bezier(.2,.9,.3,1.3);}
.levelup-bar{width:220px;height:14px;background:repeating-linear-gradient(90deg,var(--text) 0 20px,var(--bg) 20px 40px);border-radius:4px;margin:0 auto 18px;box-shadow:0 4px 14px rgba(0,0,0,.4);}
.levelup-eyebrow{font-family:'JetBrains Mono',monospace;color:var(--accent);font-size:15px;letter-spacing:.24em;text-transform:uppercase;margin-bottom:8px;}
.levelup-title{font-family:'Oswald',sans-serif;font-size:clamp(44px,14vw,64px);color:var(--text);text-transform:uppercase;margin:0;text-shadow:0 0 40px rgba(244,196,48,.6);}
.confetti-piece{position:fixed;top:-16px;z-index:998;pointer-events:none;border-radius:2px;animation:confettiFall linear forwards;}

@keyframes pulseRing{0%,100%{box-shadow:0 0 0 6px var(--glow);}50%{box-shadow:0 0 0 13px transparent;}}
@keyframes confettiFall{0%{transform:translateY(0) rotate(0deg);opacity:1;}100%{transform:translateY(115vh) rotate(480deg);opacity:0;}}
@keyframes toastIn{0%{opacity:0;transform:translate(-50%,16px) scale(.9);}100%{opacity:1;transform:translate(-50%,0) scale(1);}}
@keyframes levelPop{0%{transform:scale(.5) rotate(-6deg);opacity:0;}55%{transform:scale(1.12) rotate(2deg);opacity:1;}100%{transform:scale(1) rotate(0deg);opacity:1;}}
</style>
</head>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

/* ============================= FIREBASE (shared live storage) ============================= */
const firebaseConfig = {
  apiKey: "AIzaSyBQFQKFQXyqRH3BDyQgtpsmyKhVofT7iPU",
  authDomain: "mja-tutoring-maci-portal.firebaseapp.com",
  projectId: "mja-tutoring-maci-portal",
  storageBucket: "mja-tutoring-maci-portal.firebasestorage.app",
  messagingSenderId: "117284366966",
  appId: "1:117284366966:web:e98833ddf5f32812b48d57"
};
const firebaseApp = initializeApp(firebaseConfig);
const db = getFirestore(firebaseApp);
const stateDocRef = doc(db, "lift-log", "shared-state");

/* ===================== DATA ===================== */
// Each exercise string: "Name — sets x reps/time — note"
function D(type,title,duration,warmup,main,core,stretch){
  return {type,title,duration,warmup,main,core,stretch};
}

// ---- PHASE 1 (Weeks 1-2): dumbbells (10lb & 20lb) + resistance bands ----
function phase1Week(w){ // w = 1 or 2
  const pushSets = w===1 ? "3x6-8" : "3x9-11";
  const floorPressWt = w===1 ? "10lb" : "20lb";
  const plankT = w===1 ? "3x20s" : "3x30s";
  const sidePlankT = w===1 ? "2x20s/side" : "2x25s/side";
  const rowSets = w===1 ? "3x10 @ 20lb" : "3x12 @ 20lb";
  const bandRowSets = w===1 ? "3x12" : "3x15";
  const bandPullApart = w===1 ? "2x15" : "2x20";
  return [
    D('long','Push Foundation + Core','40 min',
      ["Arm circles — 30s each direction","Jumping jacks — x30","Shoulder rolls — x10","Bodyweight squats — x10 (leg warm-up)"],
      [`Push-ups (knee variation OK) — ${pushSets} — go to standard push-ups as soon as you can`,
       `DB Floor Press — 3x10 @ ${floorPressWt} — lie on floor, press straight up over chest`,
       `Band Standing Chest Press — 3x12 — anchor band behind you at chest height`,
       `DB Shoulder Press — 3x8 @ 10lb — seated or standing, core tight`,
       `DB Lateral Raise — 2x12 @ 10lb — light, controlled, no swinging`],
      [`Plank — ${plankT}`,"Bicycle crunch — 2x15/side"],
      ["Doorway chest stretch — 30s","Overhead triceps stretch — 30s/side","Cross-body shoulder stretch — 30s/side","Child's pose — 45s","Cat-cow — x8"]),
    D('short','Short: Abs + Arms','15-20 min — after your run',
      ["Arm circles — x10","Torso twists — x10"],
      [`Push-ups — 2x max effort`, `DB Bicep Curl — 2x10 @ 10lb`,`Band Triceps Pushdown — 2x15 — anchor band overhead`],
      ["Plank — 2x25s","Leg raises — 2x12","Russian twist — 2x20 total"],
      ["Hip flexor lunge stretch — 30s/side","Hamstring stretch — 30s/side","Quad stretch — 30s/side","Chest stretch — 30s"]),
    D('long','Pull Foundation + Core','40 min',
      ["Arm swings — x15","Hip circles — x10 each way","Bodyweight good mornings — x10"],
      [`DB Bent-over Row — ${rowSets}`,
       `Band Seated Row — ${bandRowSets} — loop band around feet, pull to torso`,
       `Band Face Pull — 3x15 — anchor at eye height, pull to face, elbows high`,
       `DB Bicep Curl — 3x10 @ 10lb`],
      [`Side plank — ${sidePlankT}`],
      ["Lat stretch — 30s/side","Upper-back doorframe stretch — 30s","Biceps stretch — 30s/side","Cat-cow — x8"]),
    D('short','Short: Push + Core','15-20 min — after your run',
      ["Arm circles — x10"],
      ["Push-ups — 2x max effort","DB Shoulder Press — 2x8 @ 10lb",`Band Pull-Apart — ${bandPullApart} — rear delts, keep arms straight`],
      ["Crunches — 2x15","Superman — 2x12"],
      ["Chest doorway stretch — 30s","Shoulder cross-body stretch — 30s/side","Hip flexor stretch — 30s/side"]),
    D('long','Full Upper + Core','45 min',
      ["Arm circles — x15","Jumping jacks — x30","Shoulder rolls — x10"],
      ["DB Floor Press — 3x10 @ 20lb","DB Bent-over Row — 3x10 @ 20lb",`Band Face Pull — 3x15`,"DB Bicep Curl — 3x10 @ 10lb","DB Triceps Kickback — 3x10 @ 10lb","Push-ups — 3x max effort"],
      [`Plank — ${w===1?'3x30s':'3x40s'}`,"Bicycle crunch — 3x15/side"],
      ["Chest doorway stretch — 30s","Lat stretch — 30s/side","Triceps overhead stretch — 30s/side","Biceps stretch — 30s/side","Child's pose — 45s"]),
    D('short','Core + Mobility','15 min — long run day',
      ["Torso twists — x10"],
      [`Band Pull-Apart — ${bandPullApart} — extra rear-delt/posture work`],
      ["Leg raises — 3x12","Bicycle crunch — 3x15","Side plank — 2x20s/side","Superman — 2x12"],
      ["Hamstring stretch — 45s/side","Calf stretch — 30s/side","Hip flexor stretch — 45s/side","Quad stretch — 30s/side","IT band stretch — 30s/side","Child's pose — 1 min"]),
    D('rest','Rest Day — Full Stretch','15 min',
      [],[],[],
      ["Neck rolls — x8 each way","Shoulder stretch — 30s/side","Chest doorway stretch — 30s","Lat stretch — 30s/side","Triceps stretch — 30s/side","Biceps stretch — 30s/side","Hip flexor stretch — 30s/side","Hamstring stretch — 30s/side","Quad stretch — 30s/side","Calf stretch — 30s/side","Child's pose — 1 min"])
  ];
}

// ---- PHASE 2 (Weeks 3-4): full gym access begins ----
function phase2Week(w){
  const benchSets = w===1 ? "3x8" : "4x8";
  const plankT = w===1 ? "3x40s" : "3x45s";
  return [
    D('long','Chest & Triceps','45 min',
      ["5 min light cardio","Arm circles — x15","Band pull-aparts or light DB pull-aparts — x15"],
      [`Barbell or DB Bench Press — ${benchSets} — pick a weight where the last rep is hard but form holds`,
       "Incline DB Press — 3x10",

function segmentPoint(pa, pb, t){
  const dy = pb.y-pa.y, half = dy/2;
  const c1x=pa.x, c1y=pa.y+half, c2x=pb.x, c2y=pb.y-half;
  const mt=1-t;
  const x = mt*mt*mt*pa.x + 3*mt*mt*t*c1x + 3*mt*t*t*c2x + t*t*t*pb.x;
  const y = mt*mt*mt*pa.y + 3*mt*mt*t*c1y + 3*mt*t*t*c2y + t*t*t*pb.y;
  return {x,y};
}
function parseDuration(str){
  let m = str.match(/(\d+)\s*(?:minutes|minute|mins|min)\b/i);
  if(m) return parseInt(m[1],10)*60;
  m = str.match(/(\d+)\s*s\b/i);
  if(m) return parseInt(m[1],10);
  return null;
}
function formatTime(sec){
  const m = Math.floor(sec/60), s = sec%60;
  return m>0 ? (m+':'+String(s).padStart(2,'0')) : (s+'s');
}

// Everything else (view position, timers, toasts, animations) is local/ephemeral.

function startStateSync(){
  onSnapshot(stateDocRef, async (snap)=>{
    if(snap.metadata.hasPendingWrites) return; // echo of our own not-yet-confirmed write; already rendered locally
    const wasAtPointer = viewIndex===pointer;
    if(!snap.exists()){
      if(!loaded){ viewIndex = Math.min(pointer, TOTAL-1); }
      loaded = true;
      render();
      try{ await setDoc(stateDocRef, { json: JSON.stringify({dayStatus, pointer, xp, badges, longestStreak}) }); }catch(e){ /* first client to arrive creates it; ignore races */ }
      return;
    }
    try{
      const parsed = JSON.parse(snap.data().json);
      if(Array.isArray(parsed.dayStatus) && parsed.dayStatus.length===TOTAL) dayStatus = parsed.dayStatus;
      if(typeof parsed.pointer==='number') pointer = parsed.pointer;
      if(typeof parsed.xp==='number') xp = parsed.xp;
      if(Array.isArray(parsed.badges)) badges = parsed.badges;
      if(typeof parsed.longestStreak==='number') longestStreak = parsed.longestStreak;
    }catch(e){ /* ignore malformed remote data */ }
    if(!loaded || wasAtPointer){ viewIndex = Math.min(pointer, TOTAL-1); }
    loaded = true;
    render();
  }, (err)=>{
    console.error("Firestore sync error", err);
    if(!loaded){
      loaded = true;
      viewIndex = Math.min(pointer, TOTAL-1);
      render();
    }
  });
}

async function saveState(){
  try{
    await setDoc(stateDocRef, { json: JSON.stringify({dayStatus, pointer, xp, badges, longestStreak}) });
  }catch(e){ console.error('Could not save progress', e); }
}

/* ===================== DERIVED / HELPERS ===================== */
function currentLevel(x){ return Math.floor(x/XP_PER_LEVEL)+1; }
function xpIntoLevel(x){ return x % XP_PER_LEVEL; }
function xpForDay(day){ return day.type==='rest' ? 5 : 15; }

function computeCurrentStreak(){
  let streak = 0;
  for(let i=pointer-1; i>=0; i--){ if(dayStatus[i]==='done') streak++; else break; }
  return streak;
}
function weekIndices(wk){ const arr=[]; PLAN.forEach((d,i)=>{ if(d.week===wk) arr.push(i); }); return arr; }
function weekStatus(wk){
  const idxs = weekIndices(wk);
  const first = idxs[0], last = idxs[idxs.length-1];
  if(pointer>last) return 'complete';
  if(pointer>=first) return 'current';
  return 'locked';
}
function weekFocusLabel(wk){
  const focusDay = PLAN.find(d=>d.week===wk && d.type==='long');
  return focusDay ? focusDay.title : '';
}
function badgeConditionMet(id){
  const doneCount = dayStatus.filter(s=>s==='done').length;
  const skipCount = dayStatus.filter(s=>s==='skipped').length;
  switch(id){
    case 'first_workout': return doneCount>=1;
    case 'ten_workouts': return doneCount>=10;
    case 'twentyfive_workouts': return doneCount>=25;
    case 'halfway': { const idx = PLAN.findIndex(d=>d.week===5); return pointer>=idx; }
    case 'perfect_week': {
      for(let wk=1; wk<=8; wk++){
        const idxs = weekIndices(wk);
        const last = idxs[idxs.length-1];
        if(pointer>last && idxs.every(i=>dayStatus[i]==='done')) return true;
      }
      return false;
    }
    case 'streak7': return longestStreak>=7;
    case 'program_complete': return pointer>=TOTAL;
    case 'no_skips': return pointer>=TOTAL && skipCount===0;
  }
  return false;
}
function checkBadges(){
  const newly = [];
  BADGE_DEFS.forEach(b=>{
    if(!badges.includes(b.id) && badgeConditionMet(b.id)){ badges.push(b.id); newly.push(b); }
  });
  return newly;
}

function burstConfetti(){

function playChime(big){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const notes = big ? [523.25,659.25,783.99,1046.5,1318.5] : [880,1174.7];
    notes.forEach((freq,i)=>{
      const osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.type = 'sine'; osc.frequency.value = freq;
      const t0 = ctx.currentTime + i*0.09;
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(big?0.18:0.15, t0+0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0+0.28);
      osc.connect(gain).connect(ctx.destination);
      osc.start(t0); osc.stop(t0+0.3);
    });
    setTimeout(()=>ctx.close(), 1000);
  }catch(e){}
}

function toggleTimer(tid, total){
  let st = timers[tid];
  if(!st){ st = {remaining: total, total, running:false, done:false}; }
  if(st.done){ st = Object.assign({}, st, {remaining: total, done:false}); }
  if(st.running){
    if(st.handle) clearInterval(st.handle);
    st = Object.assign({}, st, {running:false});
    timers[tid] = st;
    render();
    return;
  }
  st = Object.assign({}, st, {running:true});
  timers[tid] = st;
  render();
  const handle = setInterval(()=>{
    const cur = timers[tid];
    if(!cur){ clearInterval(handle); return; }
    const remaining = cur.remaining-1;
    if(remaining<=0){
      clearInterval(handle);
      timers[tid] = Object.assign({}, cur, {remaining:0, running:false, done:true});
      playChime(false);
      timerAwardXP(2);
      render();
      return;
    }
    timers[tid] = Object.assign({}, cur, {remaining});
    render();
  }, 1000);
  timers[tid].handle = handle;
}
function timerAwardXP(amount){
  const prevLevel = currentLevel(xp);
  xp += amount;
  saveState();
  if(currentLevel(xp)>prevLevel) showLevelUp(currentLevel(xp));
}

/* ===================== ACTIONS ===================== */
function markComplete(){
  if(pointer>=TOTAL) return;
  const day = PLAN[pointer];
  dayStatus[pointer]='done';
  const prevLevel = currentLevel(xp);
  xp += xpForDay(day);
  const prevWeek = day.week;
  pointer++;
  viewIndex = Math.min(pointer, TOTAL-1);
  lockMessage = '';
  longestStreak = Math.max(longestStreak, computeCurrentStreak());
  const newBadges = checkBadges();
  const crossedWeek = pointer>=TOTAL || PLAN[pointer].week!==prevWeek;
  saveState();
  render();
  if(currentLevel(xp)>prevLevel) showLevelUp(currentLevel(xp));
  if(crossedWeek) burstConfetti();
  if(newBadges.length) showToast(newBadges.map(b=>b.name).join(' · '), newBadges[0].color);
}
function skipDay(){
  if(pointer>=TOTAL) return;
  const day = PLAN[pointer];
  dayStatus[pointer]='skipped';
  const prevWeek = day.week;
  pointer++;
  viewIndex = Math.min(pointer, TOTAL-1);
  lockMessage = '';
  const newBadges = checkBadges();
  const crossedWeek = pointer>=TOTAL || PLAN[pointer].week!==prevWeek;
  saveState();
  render();
  if(crossedWeek) burstConfetti();
  if(newBadges.length) showToast(newBadges.map(b=>b.name).join(' · '), newBadges[0].color);
}
function jumpToView(){
  pointer = viewIndex;
  saveState(); render();
}
function setView(i){
  viewIndex = Math.max(0,Math.min(TOTAL-1,i));
  lockMessage = '';
  render();
}
function unmarkDay(i){
  const prevStatus = dayStatus[i];
  if(prevStatus==='pending') return;
  if(prevStatus==='done') xp = Math.max(0, xp - xpForDay(PLAN[i]));
  dayStatus[i]='pending';
  if(i<pointer) pointer=i;
  saveState(); render();
}
function requestReset(){ resetConfirming = true; render(); }
function cancelReset(){ resetConfirming = false; render(); }
function confirmReset(){
  Object.values(timers).forEach(t=>{ if(t && t.handle) clearInterval(t.handle); });
  dayStatus = new Array(TOTAL).fill('pending');
  pointer = 0; viewIndex = 0; xp = 0; badges = []; longestStreak = 0;
  resetConfirming = false; lockMessage = ''; badgesOpen = false; timers = {};
  saveState(); render();
}
function toggleMap(){ mapExpanded = !mapExpanded; render(); }
function mapNodeClick(wk){
  const status = weekStatus(wk);
  if(status==='locked'){ lockMessage = `Finish Week ${wk-1} to unlock Week ${wk}.`; render(); return; }
  lockMessage = '';
  viewIndex = weekIndices(wk)[0];
  render();
}
function toggleBadges(){ badgesOpen = !badgesOpen; render(); }

// inline onclick="..." handlers in the rendered HTML need these on window —
// module scripts don't leak top-level declarations into global scope.
Object.assign(window, {
  markComplete, skipDay, jumpToView, setView, unmarkDay, requestReset, cancelReset, confirmReset,
  toggleMap, mapNodeClick, toggleBadges, toggleTimer
});

/* ===================== RENDER ===================== */
function exList(items, prefix){
  if(!items || items.length===0) return '';
  return '<ul class="ex-list">' + items.map((s,idx)=>{
    const parts = s.split(' — ');
    const name = parts[0];
    const rest = parts.slice(1).join(' — ');
    const duration = parseDuration(s);
    let timerHtml = '';
    if(duration){
      const tid = prefix+'-'+idx;
      const st = timers[tid];
      let label='▶', bg='var(--steel)', color='var(--text-dim)', display=formatTime(duration);
      if(st){
        if(st.done){ label='✓'; bg='var(--done)'; color='var(--done)'; display='Done +2xp'; }
        else { label = st.running?'❙❙':'▶'; bg = st.running?'var(--accent)':'var(--steel)'; display=formatTime(st.remaining); }
      }
      timerHtml = `<div class="ex-timer"><button class="timer-btn" style="background:${bg};" onclick="toggleTimer('${tid}',${duration})">${label}</button><span class="timer-time" style="color:${color};">${display}</span></div>`;
    }
    return `<li><span class="ex-name">${name}</span><span class="ex-detail">${rest}</span>${timerHtml}</li>`;
  }).join('') + '</ul>';
}

  if(!loaded) return;

  const level = currentLevel(xp);
  const into = xpIntoLevel(xp);

  const streak = computeCurrentStreak();

  const mapNodes = NODE_META.map(n=>{
    const status = weekStatus(n.week);
    return Object.assign({}, n, {
      status, isLocked: status==='locked', isComplete: status==='complete', isCurrent: status==='current',
      focusLabel: weekFocusLabel(n.week)
    });
  });

  const activeWeek = Math.min(8, PLAN[Math.min(pointer, TOTAL-1)].week);
  const currentNodeData = mapNodes.find(nd=>nd.week===activeWeek);
  const nextNodeData = mapNodes.find(nd=>nd.week===activeWeek+1) || null;
  const weekStartIdx = weekIndices(activeWeek)[0];
  const weekFrac = Math.max(0, Math.min(1, (pointer - weekStartIdx)/7));

  const segIdx = Math.max(0, Math.min(7, Math.floor(pointer/7)));
  const segT = Math.max(0, Math.min(1, (pointer - segIdx*7)/7));
  const pa = ROAD_ANCHORS[segIdx], pb = ROAD_ANCHORS[segIdx+1];
  const pos = segmentPoint(pa, pb, segT);
  const facingRight = (pb.x - pa.x) > 0;

  let mapHtml;
  if(mapExpanded){
    mapHtml = `<div class="road-map expanded">
      <svg class="road-svg" viewBox="0 0 100 1860" preserveAspectRatio="none">
        <path class="road-base" d="M 50 30 C 50 95 24 95 24 160 C 24 265 76 265 76 370 C 76 475 24 475 24 580 C 24 685 76 685 76 790 C 76 895 24 895 24 1000 C 24 1105 76 1105 76 1210 C 76 1315 24 1315 24 1420 C 24 1525 76 1525 76 1630 C 76 1670 76 1690 76 1700"></path>
        <path class="road-dash" d="M 50 30 C 50 95 24 95 24 160 C 24 265 76 265 76 370 C 76 475 24 475 24 580 C 24 685 76 685 76 790 C 76 895 24 895 24 1000 C 24 1105 76 1105 76 1210 C 76 1315 24 1315 24 1420 C 24 1525 76 1525 76 1630 C 76 1670 76 1690 76 1700"></path>
      </svg>
      <div class="start-pin">${START_PIN_SVG}<div class="start-label">START</div></div>
      ${mapNodes.map(n=>`
        <div class="map-node ${n.isLocked?'locked':''}" style="left:${n.left}%;top:${n.top}px;" onclick="mapNodeClick(${n.week})">
          <div class="scene-wrap">
            <div class="scene-icon ${n.isLocked?'is-locked':''}">${n.icon}</div>
            <div class="node-badge ${n.isCurrent?'current':''}" style="background:${n.isComplete?'var(--done)':n.isCurrent?'var(--accent)':'var(--bg-raised)'};border-color:${n.isComplete?'var(--done)':n.isCurrent?'var(--accent)':'var(--line)'};color:${n.isCurrent?'#14171c':'var(--text-dim)'};">
              ${n.isComplete ? CHECK_SVG : n.isLocked ? LOCK_SVG : `<span>${n.week}</span>`}
            </div>
          </div>
          <div class="postcard" style="transform:rotate(${n.tilt}deg);">
            <div class="pc-eyebrow">WEEK ${n.week} · ${n.nameUpper}</div>
            <div class="pc-title">${n.focusLabel}</div>
          </div>
        </div>`).join('')}
      <div class="map-car" style="left:${pos.x}%;top:${pos.y}px;transform:translate(-50%,-50%) rotate(${facingRight?-9:9}deg);">🚗</div>
    </div>
    <div class="map-toggle"><a onclick="toggleMap()">Collapse map</a></div>`;
  } else {
    mapHtml = `<div class="road-map">
      <div class="collapsed-inner">
        <div class="scene-icon big">${currentNodeData.icon}</div>
        <div class="postcard">
          <div class="pc-eyebrow">WEEK ${currentNodeData.week} · ${currentNodeData.nameUpper}</div>
          <div class="pc-title">${currentNodeData.focusLabel}</div>
        </div>
        <div class="rail-row">
          <div class="rail"><div class="rail-dash"></div><div class="rail-car" style="left:${4+weekFrac*88}%;">🚗</div></div>
          ${nextNodeData ? `<div class="next-thumb">${nextNodeData.icon}</div>` : ''}
        </div>
      </div>
    </div>
    <div class="map-toggle"><a onclick="toggleMap()">Show full map</a></div>`;
  }

  const badgeListHtml = badgesOpen ? `<div class="badges-panel">${BADGE_DEFS.map(b=>{
    const earned = badges.includes(b.id);
    return `<div class="badge-row">
      ${badgeShield(earned ? b.color : '#3a4048').replace('style="flex-shrink:0;"', `class="badge-icon" style="opacity:${earned?1:0.45}"`)}
      <div><div class="badge-name" style="color:${earned?'var(--text)':'var(--text-faint)'}">${b.name}</div><div class="badge-desc">${b.desc}</div></div>
    </div>`;
  }).join('')}</div>` : '';

  const wk = day.week;
  const idxs = weekIndices(wk);
  const stripDoneCount = idxs.filter(i=>dayStatus[i]==='done').length;
  const dayStripHtml = idxs.map(i=>{
    let cls='dtick';
    if(dayStatus[i]==='done') cls+=' done'; else if(dayStatus[i]==='skipped') cls+=' skipped';
    if(PLAN[i].type==='rest') cls+=' type-rest';
    if(i===viewIndex) cls+=' current';
    return `<div class="${cls}" title="${PLAN[i].dow}: ${PLAN[i].title}" onclick="setView(${i})"></div>`;
  }).join('');

  let bodyHtml = '';
  if(pointer>=TOTAL){
    bodyHtml += `<div class="card finish"><div class="eyebrow">Program Complete</div><h2>8 Weeks Done</h2><p class="sub">You've completed every scheduled workout. Browse the map above to revisit any week, or reset to run it again at a higher weight.</p></div>`;
  } else if(!isPointerView){
    const status = dayStatus[viewIndex];
    const label = status==='done' ? 'completed' : status==='skipped' ? 'skipped' : 'not yet reached';
    bodyHtml += `<div class="preview-banner"><span>Previewing <b>Week ${day.week}, ${day.dow}</b> (${label}). Your next workout is <b>Week ${PLAN[pointer].week}, ${PLAN[pointer].dow}</b>.</span>
      <button class="btn-jump" onclick="setView(${pointer})">Go to next workout</button></div>`;
  }

  const badgeClass = day.type==='long'?'long':day.type==='short'?'short':'rest';
  const badgeText = day.type==='long' ? 'Full Session' : day.type==='short' ? 'Short Session' : 'Rest Day';

  bodyHtml += `<div class="card">
    <div class="card-head">
      <div>
        <span class="badge ${badgeClass}">${badgeText}</span>
        <h2 class="day-title">${day.title}</h2>
        <div class="day-meta">WEEK ${day.week} · ${day.dow.toUpperCase()} · ${day.phase.toUpperCase()}</div>
      </div>
      <div class="duration">${day.duration.split(' — ')[0]}<small>${day.duration.includes(' — ')? day.duration.split(' — ')[1] : ''}</small></div>
    </div>`;

  if(day.type==='short'){
    bodyHtml += `<div class="run-note">This is a short day — designed to follow a run. Keep it efficient; upper body and core only.</div>`;
  }

  const sectionDefs = [
    {key:'warmup', label:'Warm-up', cls:''},
    {key:'main', label:'Lifts', cls:''},
    {key:'core', label:'Core', cls:''},
    {key:'stretch', label:'Stretch — Cool Down', cls:'stretch'}
  ];
  sectionDefs.forEach(sec=>{
    const items = day[sec.key];
    if(!items || !items.length) return;
    bodyHtml += `<div class="section"><div class="section-label ${sec.cls}">${sec.label}</div>${exList(items, viewIndex+'-'+sec.key)}</div>`;
  });

  const viewStatus = dayStatus[viewIndex];
  if(viewStatus==='done'){
    bodyHtml += `<div class="done-banner">Marked complete. Tapped by accident? You can undo it below.</div>`;
  } else if(viewStatus==='skipped'){
    bodyHtml += `<div class="skip-banner">Marked skipped. Tapped by accident? You can undo it below.</div>`;
  }

  if(isPointerView && pointer<TOTAL){
    bodyHtml += `<div class="actions">
      <button class="btn-complete" onclick="markComplete()">Mark Complete — Next Workout</button>
      <button class="btn-skip" onclick="skipDay()">Skip This Day</button>
    </div>`;
  } else if(viewStatus==='done' || viewStatus==='skipped'){
    bodyHtml += `<div class="actions"><button class="btn-skip" onclick="unmarkDay(${viewIndex})">Undo — Set Back to Pending</button></div>`;
  } else if(!isPointerView && viewStatus==='pending' && viewIndex!==pointer){
    bodyHtml += `<div class="actions"><button class="btn-jump" onclick="jumpToView()">Set as my next workout</button></div>`;
  }

  bodyHtml += `<div class="footer-nav">
    <button class="btn-nav" onclick="setView(${Math.max(0,viewIndex-1)})" ${viewIndex===0?'disabled':''}>← Prev</button>
    <button class="btn-nav" onclick="setView(${Math.min(TOTAL-1,viewIndex+1)})" ${viewIndex===TOTAL-1?'disabled':''}>Next →</button>
  </div>`;

  bodyHtml += `</div>`;

  const toastsHtml = toasts.map(t=>`<div class="toast" style="border-color:${t.color};">${badgeShield(t.color)}${t.msg}</div>`).join('');
  const levelUpHtml = levelUp ? `<div class="levelup-overlay"><div class="levelup-card"><div class="levelup-bar"></div><div class="levelup-eyebrow">Level Up</div><h2 class="levelup-title">Lv. ${levelUp.level}</h2></div></div>` : '';
  const confettiHtml = confetti.map(c=>`<div class="confetti-piece" style="left:${c.left}vw;width:${c.size}px;height:${c.height}px;background:${c.color};animation-duration:${c.duration}s;"></div>`).join('');

  app.innerHTML = `
    <div class="header-card">
      <div class="eyebrow">8-Week Upper Body Program · ${day.phase}</div>
      <h1>Day ${viewIndex+1} / ${TOTAL}</h1>
      <p class="sub" style="margin-bottom:0;">Runner base, building push/pull/core strength from zero. Tap any marker below to preview a day.</p>
      <div class="stats-row">
        <div class="streak-pill">${streak} day streak</div>
        <div class="level-pill">Lv.${level}</div>
        <div class="xp-wrap">
          <div class="xp-track"><div class="xp-fill" style="width:${xpPercent}%;"></div></div>
          <div class="xp-label">${into} / ${XP_PER_LEVEL} XP</div>
        </div>
      </div>
    </div>

    ${mapHtml}

    ${lockMessage ? `<div class="lock-message">${lockMessage}</div>` : ''}

    <button class="badges-toggle" onclick="toggleBadges()"><span>Badges — ${badges.length}/${BADGE_DEFS.length}</span><span>${badgesOpen?'▲':'▼'}</span></button>
    ${badgeListHtml}

    <div class="day-strip-wrap">
      <div class="day-strip-label"><span>WEEK ${wk} DAYS</span><span>${stripDoneCount}/${idxs.length} done</span></div>
      <div class="day-strip">${dayStripHtml}</div>
    </div>

    ${bodyHtml}

    ${resetConfirming ? `
    <div class="reset-confirm">
      <p>Reset all progress — including XP, streak, and badges? This can't be undone.</p>
      <div class="actions">
        <button class="btn-nav" onclick="cancelReset()">Cancel</button>
        <button class="btn-danger" onclick="confirmReset()">Yes, Reset Everything</button>
      </div>
    </div>` : `
    <div class="reset-link"><a onclick="requestReset()">Reset all progress</a></div>`}

    ${toastsHtml}
    ${levelUpHtml}
    ${confettiHtml}
  `;
}

startStateSync();
</script>
</body>
</html>
