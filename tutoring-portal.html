<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MJA Tutoring Booking Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Lato:wght@700;900&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F6F4EE;
    --surface:#FFFFFF;
    --tab-inactive:#E8E2D0;
    --ink:#23302A;
    --ink-soft:#5B6660;
    --ink-faint:#8B9490;
    --accent:#2E6F5E;
    --accent-dark:#205245;
    --accent-soft:#DCEAE4;
    --gold:#C9962F;
    --gold-soft:#F3E6C9;
    --danger:#B54A3F;
    --danger-soft:#F5DEDA;
    --line:#DCD5C2;
    --invoice-navy:#1F3A52;
    --radius:10px;
    --shadow: 0 1px 2px rgba(35,48,42,0.06), 0 4px 14px rgba(35,48,42,0.05);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  h1,h2,h3,.display{ font-family:'Lato',sans-serif; font-weight:700; letter-spacing:-0.01em; }
  .mono{font-family:'IBM Plex Mono',monospace;}
  a{color:var(--accent-dark);}

  .shell{max-width:980px;margin:0 auto;padding:28px 20px 40px;}
  .topbar{margin-bottom:18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .site-logo{height:52px;width:auto;display:block;}
  .brand .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-dark);display:block;}
  .brand h1{font-size:26px;margin:2px 0 0;font-weight:600;color:var(--ink);}

  .site-footer{max-width:980px;margin:26px auto 0;padding:0 20px;display:flex;justify-content:center;}
  .footer-link{font-size:12px;color:var(--ink-faint);text-decoration:none;border-bottom:1px dotted var(--ink-faint);padding-bottom:1px;}
  .footer-link:hover{color:var(--accent-dark);border-color:var(--accent-dark);}

  .tabs{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap;}
  .tab{
    position:relative;padding:10px 20px 12px;background:var(--tab-inactive);color:var(--ink-soft);
    font-weight:600;font-size:13.5px;cursor:pointer;border:none;
    clip-path:polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%);
    margin-right:-8px;transition:background .15s ease, color .15s ease;font-family:'Inter',sans-serif;
  }
  .tab:hover{background:#E2DCC8;}
  .tab.active{background:var(--surface);color:var(--ink);z-index:2;box-shadow:0 -2px 8px rgba(35,48,42,0.05);}
  .tab-panel{ background:var(--surface); border-radius:0 var(--radius) var(--radius) var(--radius); box-shadow:var(--shadow); padding:26px; position:relative; }
  @media (max-width:640px){ .tabs{flex-wrap:wrap;} .tab{padding:9px 14px 10px;font-size:12.5px;} .tab-panel{padding:18px;} }

  .card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px; position:relative; margin-bottom:12px; }
  .card::before{ content:''; position:absolute;top:10px;left:-1px;bottom:10px;width:3px; background:var(--accent); border-radius:0 3px 3px 0; opacity:.55; }
  .card.gold::before{background:var(--gold);}
  .card.danger::before{background:var(--danger);}
  .card-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;}

  .btn{ font-family:'Inter',sans-serif; font-weight:600; font-size:13px; padding:9px 16px; border-radius:8px; border:1px solid transparent; cursor:pointer; transition:transform .08s ease, opacity .15s ease; }
  .btn:active{transform:scale(0.97);}
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-primary:hover{background:var(--accent-dark);}
  .btn-gold{background:var(--gold);color:#3a2c08;}
  .btn-gold:hover{opacity:.9;}
  .btn-ghost{background:transparent;color:var(--ink-soft);border-color:var(--line);}
  .btn-ghost:hover{border-color:var(--accent);color:var(--accent-dark);}
  .btn-danger{background:transparent;color:var(--danger);border-color:var(--danger-soft);}
  .btn-danger:hover{background:var(--danger-soft);}
  .btn-sm{padding:6px 11px;font-size:12px;border-radius:6px;}
  .btn:disabled{opacity:.4;cursor:not-allowed;}

  label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;}
  input,select,textarea{ width:100%; font-family:'Inter',sans-serif; font-size:14px; padding:9px 11px; border:1px solid var(--line); border-radius:7px; background:#FCFBF7; color:var(--ink); }
  input:focus,select:focus,textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent);}
  .field{margin-bottom:14px;}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
  @media (max-width:560px){.grid-2,.grid-3{grid-template-columns:1fr;}}
  .form-box{background:var(--accent-soft);border-radius:var(--radius);padding:18px;margin-bottom:20px;}
  .form-box h3{margin:0 0 12px;font-size:16px;}

  .section-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px;}
  .section-title h2{font-size:19px;margin:0;}
  .muted{color:var(--ink-faint);font-size:13px;}
  .badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;font-family:'IBM Plex Mono',monospace;letter-spacing:.02em;}
  .badge.upcoming{background:var(--accent-soft);color:var(--accent-dark);}
  .badge.completed{background:var(--gold-soft);color:#6b4f0f;}
  .badge.cancelled{background:var(--danger-soft);color:var(--danger);}
  .empty{text-align:center;padding:40px 20px;color:var(--ink-faint);}
  .empty .display{font-size:20px;color:var(--ink-soft);margin-bottom:6px;}
  .day-heading{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);margin:18px 0 8px;}
  .toast{ position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px); background:var(--ink);color:#fff;padding:11px 20px;border-radius:8px; font-size:13.5px;font-weight:500;opacity:0;pointer-events:none; transition:opacity .2s ease, transform .2s ease;z-index:99; }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .modal-overlay{ position:fixed; inset:0; background:rgba(35,48,42,0.45); display:flex; align-items:center; justify-content:center; z-index:200; padding:20px; }
  .modal-box{ background:var(--surface); border-radius:var(--radius); padding:22px; max-width:380px; width:100%; box-shadow:var(--shadow); }
  .modal-box p{ margin:0 0 18px; font-size:14px; color:var(--ink); line-height:1.5; }
  .modal-actions{ display:flex; justify-content:flex-end; gap:8px; }
  .msg-thread{ display:flex; flex-direction:column; gap:8px; max-height:360px; overflow-y:auto; padding:4px 2px; margin-bottom:4px; }
  .msg-bubble{ max-width:82%; padding:8px 12px; font-size:13.5px; line-height:1.4; }
  .msg-bubble.msg-mine{ align-self:flex-end; background:var(--accent-soft); color:var(--ink); border-radius:10px 10px 2px 10px; }
  .msg-bubble.msg-theirs{ align-self:flex-start; background:var(--tab-inactive); color:var(--ink); border-radius:10px 10px 10px 2px; }
  .msg-meta{ font-size:10.5px; color:var(--ink-faint); margin-bottom:2px; font-family:'IBM Plex Mono',monospace; }
  .msg-body{ white-space:pre-wrap; word-break:break-word; }
  .lock-screen{max-width:340px;margin:40px auto;text-align:center;}
  .lock-screen input{text-align:center;font-family:'IBM Plex Mono',monospace;font-size:18px;letter-spacing:.2em;}
  .icon-btn{background:none;border:none;cursor:pointer;color:var(--ink-faint);font-size:13px;padding:2px 4px;text-decoration:underline;}
  .icon-btn:hover{color:var(--danger);}
  .pin-chip{font-family:'IBM Plex Mono',monospace;background:var(--tab-inactive);padding:3px 9px;border-radius:6px;font-size:13px;letter-spacing:.1em;}

  /* ---------- Student dashboard ---------- */
  .greet-row{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:18px;}
  .greet-row h2{margin:0;font-size:22px;}
  .tutor-chip{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent-dark);padding:4px 11px;border-radius:999px;font-size:12.5px;font-weight:600;margin-right:6px;}

  /* ---------- Invoice document ---------- */
  .invoice-doc{ background:#fff; border:1px solid var(--line); border-radius:8px; padding:34px; max-width:680px; margin:0 auto; }
  .invoice-top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap;}
  .invoice-logo img{height:64px;width:auto;display:block;margin-bottom:8px;}
  .invoice-logo .site-lines{font-family:'IBM Plex Mono',monospace;font-style:normal;font-size:10.5px;letter-spacing:.02em;color:var(--ink-faint);line-height:1.6;}
  .invoice-title{text-align:right;}
  .invoice-title h2{margin:0;font-size:26px;}
  .invoice-title .num{color:var(--invoice-navy);font-family:'IBM Plex Mono',monospace;font-size:13px;}
  .balance-box{margin-top:10px;}
  .balance-box .lbl{font-size:11px;font-weight:700;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.06em;}
  .balance-box .amt{font-size:19px;font-weight:700;}
  .invoice-meta{display:flex;justify-content:space-between;margin:26px 0 16px;flex-wrap:wrap;gap:16px;}
  .invoice-meta .bill-to .lbl{font-size:12px;color:var(--ink-faint);}
  .invoice-meta .bill-to .name{font-weight:700;color:var(--accent-dark);}
  .meta-table td{padding:1px 0;font-size:12.5px;}
  .meta-table td:first-child{color:var(--invoice-navy);padding-right:14px;}
  .meta-table{margin-left:auto;}
  table.invoice-items{width:100%;border-collapse:collapse;margin-top:6px;}
  table.invoice-items thead th{background:var(--invoice-navy);color:#fff;text-align:left;font-size:12px;padding:9px 10px;}
  table.invoice-items thead th:last-child, table.invoice-items td:last-child{text-align:right;}
  table.invoice-items tbody td{padding:8px 10px;font-size:12.5px;border-bottom:1px solid var(--line);}
  table.invoice-items tbody tr:nth-child(even){background:#FAF8F2;}
  .invoice-total-row td{padding-top:10px;font-weight:700;border-top:2px solid var(--ink);border-bottom:none !important;}
  .invoice-due-row{background:#EFEBE0;margin-top:10px;padding:10px 14px;display:flex;justify-content:space-between;border-radius:6px;font-weight:700;}
  .invoice-payment{margin-top:22px;font-size:12.5px;}
  .invoice-payment .lbl{text-decoration:underline;font-weight:600;margin-bottom:4px;display:block;}
  .draft-flag{display:inline-block;background:var(--danger-soft);color:var(--danger);font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;margin-left:8px;font-family:'IBM Plex Mono',monospace;}
  .invoice-actions{display:flex;gap:8px;margin:16px auto 0;max-width:680px;flex-wrap:wrap;}
  .invoice-note{max-width:680px;margin:8px auto 0;}

  @media print{
    body *{ visibility:hidden; }
    .invoice-doc.print-active, .invoice-doc.print-active *{ visibility:visible; -webkit-print-color-adjust:exact; print-color-adjust:exact; color-adjust:exact; }
    .invoice-doc.print-active{ position:absolute; top:0; left:0; width:100%; border:none; box-shadow:none; }
    table.invoice-items thead th{ background:var(--invoice-navy) !important; color:#fff !important; }
    table.invoice-items tbody tr:nth-child(even){ background:#FAF8F2 !important; }
    .invoice-due-row{ background:#EFEBE0 !important; }
  }
</style>
</head>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

/* ============================= FIREBASE (shared live storage) ============================= */
const firebaseConfig = {
  apiKey: "AIzaSyBQFQKFQXyqRH3BDyQgtpsmyKhVofT7iPU",
  authDomain: "mja-tutoring-maci-portal.firebaseapp.com",
  projectId: "mja-tutoring-maci-portal",
  storageBucket: "mja-tutoring-maci-portal.firebasestorage.app",
  messagingSenderId: "117284366966",
  appId: "1:117284366966:web:e98833ddf5f32812b48d57"
};
const firebaseApp = initializeApp(firebaseConfig);
const db = getFirestore(firebaseApp);
const stateDocRef = doc(db, "tutoring-portal", "shared-state");

/* ============================= DATA LAYER ============================= */
const ADMIN_PIN = "0308"; // change this to whatever PIN you two want to use for the Manage area

const DAY_NAMES = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const DAY_SHORT = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

let STATE = null;
let adminUnlocked = false;
let currentRole = "landing";
let introBooking = { name: "", email: "", date: "", time: "" };
let introConfirmation = null;
let currentTab = "sessions";
let loggedInStudentId = null;
let loginError = "";
let bookFlow = { tutorId: null, date: "", time: "" };
let invoiceSel = { studentId: "", month: new Date().toISOString().slice(0,7) };
let studentHomeTab = "home";
let newTodoText = "";
let loggedInParentId = null;
let parentLoginError = "";
let parentSel = { studentId: null, tab: "sessions", invoiceId: null };
let adminMessageSel = { parentId: null };

function defaultState(){
  return {
    settings: {
      businessName: "MJA Tutoring",
      invoiceEmail: "info@mjatutoring.com",
      website: "mjatutoring.com",
      terms: "Due on Receipt",
      nextInvoiceNumber: 1001,
      introTutorId: ""
    },
    tutors: [],
    students: [],
    parents: [],
    sessions: [],
    invoices: [],
    todos: [],
    assignments: [],
    messages: []
  };
}

function randomPin(){
  return String(Math.floor(1000 + Math.random()*9000));
}

function migrate(state){
  state.settings = Object.assign(defaultState().settings, state.settings || {});
  delete state.settings.paymentInstructions;
  state.invoices = state.invoices || [];
  state.parents = state.parents || [];
  state.todos = state.todos || [];
  state.assignments = state.assignments || [];
  state.messages = state.messages || [];
  (state.students||[]).forEach(s=>{
    if(!s.tutors){
      s.tutors = s.tutorId ? [{ tutorId: s.tutorId, zoomLink: s.zoomLink||"", rate: s.rate||0 }] : [];
      delete s.tutorId; delete s.zoomLink; delete s.rate;
    }
    if(!s.pin) s.pin = randomPin();
    if(s.billToName === undefined) s.billToName = "";
    if(s.billingEmail === undefined) s.billingEmail = "";
    if(s.additionalBillingEmails === undefined) s.additionalBillingEmails = [];
  });
  (state.tutors||[]).forEach(t=>{
    if(t.paymentInfo === undefined) t.paymentInfo = "";
  });
  (state.sessions||[]).forEach(s=>{
    if(s.notes === undefined) s.notes = "";
  });
  (state.parents||[]).forEach(p=>{
    if(!p.pin) p.pin = randomPin();
    if(!p.studentIds) p.studentIds = [];
  });
  (state.assignments||[]).forEach(a=>{
    if(a.dueDate === undefined) a.dueDate = "";
    if(a.submissionType === undefined) a.submissionType = "text";
  });
  migrateInvoicesToCombined(state);
  return state;
}

function migrateInvoicesToCombined(state){
  const legacy = (state.invoices||[]).filter(iv=>iv.tutorId !== undefined);
  if(legacy.length===0) return;
  const groups = {};
  legacy.forEach(iv=>{
    const key = iv.studentId+"|"+iv.month;
    if(!groups[key]){
      groups[key] = { studentId: iv.studentId, month: iv.month, number: iv.number, generatedAt: iv.generatedAt, blocks: [] };
    }
    const g = groups[key];
    if(iv.number < g.number) g.number = iv.number;
    if(iv.generatedAt > g.generatedAt) g.generatedAt = iv.generatedAt;
    const tutor = (state.tutors||[]).find(t=>t.id===iv.tutorId);
    g.blocks.push({
      tutorId: iv.tutorId,
      tutorName: tutor ? tutor.name : (iv.lineItems[0] ? iv.lineItems[0].tutorName : "—"),
      lineItems: iv.lineItems,
      subtotal: iv.total
    });
  });
  const combined = Object.keys(groups).map(key=>{
    const g = groups[key];
    const tutorBlocks = g.blocks.sort((a,b)=>b.lineItems.length-a.lineItems.length);
    return {
      id: uid("inv"),
      number: g.number,
      studentId: g.studentId,
      month: g.month,
      generatedAt: g.generatedAt,
      tutorBlocks,
      total: tutorBlocks.reduce((sum,b)=>sum+b.subtotal,0)
    };
  });
  const kept = (state.invoices||[]).filter(iv=>iv.tutorId === undefined);
  state.invoices = kept.concat(combined);
}

let stateLoaded = false;

function startStateSync(){
  onSnapshot(stateDocRef, async (snap)=>{
    if(snap.metadata.hasPendingWrites) return; // this is the echo of our own not-yet-confirmed write; we already rendered it locally
    if(!snap.exists()){
      STATE = defaultState();
      stateLoaded = true;
      render();
      try{ await setDoc(stateDocRef, { json: JSON.stringify(STATE) }); }catch(e){ /* first client to arrive creates it; ignore races */ }
      return;
    }
    STATE = migrate(JSON.parse(snap.data().json));
    const active = document.activeElement;
    const isTyping = active && (active.tagName === "INPUT" || active.tagName === "TEXTAREA");
    if(!stateLoaded || !isTyping){ render(); }
    stateLoaded = true;
  }, (err)=>{
    console.error("Firestore sync error", err);
    if(!stateLoaded){
      STATE = defaultState();
      stateLoaded = true;
      render();
    }
    showToast("Couldn't reach the shared database — check your connection.");
  });
}

async function saveState(){
  try{
    await setDoc(stateDocRef, { json: JSON.stringify(STATE) });
  }catch(e){
    showToast("Couldn't save — check your connection.");
  }
}

function uid(prefix){ return prefix + "_" + Math.random().toString(36).slice(2,9); }

function showToast(msg){
  const t = document.getElementById("toast");

}

/* ============================= CONFIRM MODAL =============================
   Google Sites embeds this page in a sandboxed iframe that blocks
   window.confirm(), which silently no-ops every "are you sure?" action.
   This is an in-page replacement. */
let pendingConfirm = null;
function showConfirmModal(message, onConfirm){
  pendingConfirm = { message, onConfirm };
  renderConfirmModal();
}
function renderConfirmModal(){
  const root = document.getElementById("confirm-modal-root");
  if(!pendingConfirm){ root.innerHTML = ""; return; }
  root.innerHTML = `
    <div class="modal-overlay" id="confirm-modal-overlay">
      <div class="modal-box">
        <p>${escapeHtml(pendingConfirm.message)}</p>
        <div class="modal-actions">
          <button class="btn btn-ghost btn-sm" id="confirm-modal-cancel">Cancel</button>
          <button class="btn btn-danger btn-sm" id="confirm-modal-ok">Confirm</button>
        </div>
      </div>
    </div>`;
  const close = ()=>{ pendingConfirm = null; renderConfirmModal(); };
  document.getElementById("confirm-modal-cancel").onclick = close;
  document.getElementById("confirm-modal-overlay").onclick = (e)=>{ if(e.target.id==="confirm-modal-overlay") close(); };
  document.getElementById("confirm-modal-ok").onclick = ()=>{
    const cb = pendingConfirm.onConfirm;
    pendingConfirm = null;
    renderConfirmModal();
    cb();
  };
}

/* ============================= DATE HELPERS ============================= */
function pad(n){ return n.toString().padStart(2,"0"); }
function toDateStr(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function fmtDateNice(dateStr){
  const d = new Date(dateStr+"T00:00:00");
  return d.toLocaleDateString(undefined,{weekday:'short', month:'short', day:'numeric'});
}
function fmtDateSlash(dateStr){
  const [y,m,d] = dateStr.split("-");
  return `${parseInt(m)}/${parseInt(d)}/${y}`;
}
function fmtTimeNice(t){
  const [h,m] = t.split(":").map(Number);
  const ampm = h>=12 ? "PM":"AM";
  const h12 = ((h+11)%12)+1;
  return `${h12}:${pad(m)} ${ampm}`;
}
function minsToTime(mins){ return pad(Math.floor(mins/60)) + ":" + pad(mins%60); }
function timeToMins(t){ const [h,m] = t.split(":").map(Number); return h*60+m; }
function currentMonthStr(){ return new Date().toISOString().slice(0,7); }
function fmtMsgTime(iso){
  const d = new Date(iso);
  return d.toLocaleDateString(undefined,{month:'short',day:'numeric'}) + ", " + d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});
}

/* ============================= ASSIGNMENTS (Canvas-style status) ============================= */
function assignmentStatus(a){
  const submitted = !!a.submittedAt;
  if(submitted){
    if(a.dueDate && a.submittedAt > a.dueDate) return "late";
    return "submitted";
  }
  const today = toDateStr(new Date());
  if(a.dueDate && today > a.dueDate) return "missing";
  return "open";
}
function assignmentStatusBadgeHTML(status){
  const map = {
    submitted: {cls:"completed", label:"Submitted"},
    late: {cls:"completed", label:"Submitted late"},
    missing: {cls:"cancelled", label:"Missing"},
    open: {cls:"upcoming", label:"Not submitted"}
  };
  const s = map[status];
  return `<span class="badge ${s.cls}">${s.label}</span>`;
}
function sortByDueDate(list){
  return list.slice().sort((a,b)=>{
    if(a.dueDate && b.dueDate) return a.dueDate.localeCompare(b.dueDate);
    if(a.dueDate) return -1;
    if(b.dueDate) return 1;
    return (a.createdAt||"").localeCompare(b.createdAt||"");
  });
}

/* ============================= PARENT LOGIN (box on the landing page) ============================= */
function renderParentLoginBox(){
  let html = `<div class="card" style="margin-bottom:0;">
    <div class="display" style="font-size:17px;margin-bottom:4px;">Parents</div>`;
  if(STATE.parents.length===0){
    html += `<p class="muted">Ask your tutor to add a parent login under Manage → Parents.</p>`;
  }else{
    html += `<p class="muted" style="margin-bottom:14px;">Type your name and the PIN your tutor gave you.</p>
      <div class="field"><label>Your name</label>
        <input id="plogin-name" type="text" autocomplete="off" />
      </div>
      <div class="field"><label>Pin</label><input id="plogin-pin" type="password" maxlength="4" /></div>
      <button class="btn btn-primary" id="plogin-submit" style="width:100%;">Sign in</button>
      <p class="muted" style="color:var(--danger);margin-top:10px;height:14px;">${parentLoginError}</p>`;
  }
  html += `</div>`;
  return html;
}
function wireParentLoginBox(){
  if(STATE.parents.length===0) return;
  const submit = ()=>{
    const typedName = document.getElementById("plogin-name").value.trim().toLowerCase();
    const pin = document.getElementById("plogin-pin").value;
    if(!typedName){ parentLoginError = "Type your name first."; render(); return; }
    const parent = STATE.parents.find(p=>p.name.trim().toLowerCase()===typedName);
    if(!parent || parent.pin !== pin){ parentLoginError = "That name and PIN don't match — check with your tutor."; render(); return; }
    parentLoginError = "";
    loggedInParentId = parent.id;
    parentSel = { studentId: (parent.studentIds||[])[0] || null, tab: "sessions", invoiceId: null };
    bookFlow = { tutorId: null };
    render();
  };
  document.getElementById("plogin-submit").onclick = submit;
  document.getElementById("plogin-name").addEventListener("keydown", e=>{ if(e.key==="Enter") document.getElementById("plogin-pin").focus(); });
  document.getElementById("plogin-pin").addEventListener("keydown", e=>{ if(e.key==="Enter") submit(); });
}

/* ============================= LANDING PAGE (informational session + student/parent sign-in) ============================= */
function getIntroCallTutor(){
  if(STATE.settings.introTutorId){
    const t = STATE.tutors.find(t=>t.id===STATE.settings.introTutorId);
    if(t) return t;
  }
  return STATE.tutors.find(t=>t.name.trim().toLowerCase()==="max") || null;
}
function getTimesForDate(tutor, dateStr, len){
  const dow = new Date(dateStr+"T00:00:00").getDay();
  const blocks = (tutor.availability||[]).filter(a=>a.day===dow);
  const now = new Date();
  const isToday = dateStr === toDateStr(now);
  const out = [];
  blocks.forEach(b=>{
    let start = timeToMins(b.start);
    const end = timeToMins(b.end);
    while(start + len <= end){
      const timeStr = minsToTime(start);
      const isPast = isToday && start <= (now.getHours()*60+now.getMinutes());
      const taken = STATE.sessions.some(s=>s.tutorId===tutor.id && s.date===dateStr && s.startTime===timeStr && s.status!=="cancelled");
      if(!isPast && !taken){ out.push(timeStr); }
      start += len;
    }
  });
  return out;
}
function maxBookingDateStr(){
  const d = new Date(); d.setDate(d.getDate()+21);
  return toDateStr(d);
}
function renderIntroCallWidget(){
  const tutor = getIntroCallTutor();
  let html = `<div class="section-title"><h2>Book a free Informational Session</h2></div>`;
  if(!tutor){
    html += `<p class="muted">Informational Session booking isn't set up yet — staff can pick a tutor for it under Manage → Settings.</p>`;
    return html;
  }
  if(introConfirmation){
    html += `<div class="form-box">
      <p style="margin:0;">You're booked, ${escapeHtml(introConfirmation.name)}! ${escapeHtml(introConfirmation.tutorName)} will see you ${fmtDateNice(introConfirmation.date)} at ${fmtTimeNice(introConfirmation.time)}. We'll follow up at ${escapeHtml(introConfirmation.email)}.</p>
    </div>`;
    return html;
  }
  const today = toDateStr(new Date());
  const maxDate = maxBookingDateStr();
  const times = introBooking.date ? getTimesForDate(tutor, introBooking.date, 30) : [];
  html += `<div class="form-box">
    <p class="muted" style="margin-top:-4px;">Grab a free 30-minute Informational Session with ${escapeHtml(tutor.name)} to see if we're a good fit — no account needed.</p>
    <div class="grid-2">
      <div class="field"><label>Your name</label><input id="intro-name" value="${escapeHtml(introBooking.name)}" placeholder="Your name"></div>
      <div class="field"><label>Your email</label><input id="intro-email" type="email" value="${escapeHtml(introBooking.email)}" placeholder="you@email.com"></div>
    </div>
    <div class="grid-2">
      <div class="field"><label>Date</label><input type="date" id="intro-date" min="${today}" max="${maxDate}" value="${escapeHtml(introBooking.date)}"></div>
      <div class="field"><label>Time</label>
        <select id="intro-time" ${!introBooking.date?"disabled":""}>
          <option value="">${!introBooking.date ? "Pick a date first" : (times.length ? "Select a time…" : "No times that day")}</option>
          ${times.map(t=>`<option value="${t}" ${t===introBooking.time?"selected":""}>${fmtTimeNice(t)}</option>`).join("")}
        </select>
      </div>
    </div>
    <button class="btn btn-primary" id="intro-book-btn" style="width:100%;margin-top:4px;" ${!introBooking.date||!introBooking.time?"disabled":""}>Book Informational Session</button>
  </div>`;
  return html;
}
function renderLandingPage(){
  let html = `<div class="tab-panel">`;
  html += renderIntroCallWidget();
  html += `<div class="section-title" style="margin-top:8px;"><h2>Sign in</h2></div>`;
  html += `<div class="grid-2">`;
  html += renderStudentLoginBox();
  html += renderParentLoginBox();
  html += `</div>`;
  html += `</div>`;
  return html;
}
function wireLandingPage(){
  const nameEl = document.getElementById("intro-name");
  const emailEl = document.getElementById("intro-email");
  if(nameEl) nameEl.addEventListener("input", ()=>{ introBooking.name = nameEl.value; });
  if(emailEl) emailEl.addEventListener("input", ()=>{ introBooking.email = emailEl.value; });
  const dateEl = document.getElementById("intro-date");
  if(dateEl) dateEl.addEventListener("change", ()=>{ introBooking.date = dateEl.value; introBooking.time = ""; render(); });
  const timeEl = document.getElementById("intro-time");
  if(timeEl) timeEl.addEventListener("change", ()=>{ introBooking.time = timeEl.value; render(); });
  const bookBtn = document.getElementById("intro-book-btn");
  if(bookBtn) bookBtn.onclick = async ()=>{
    const name = (document.getElementById("intro-name").value || "").trim();
    const email = (document.getElementById("intro-email").value || "").trim();
    if(!name || !email){ showToast("Add your name and email first."); return; }
    if(!introBooking.date || !introBooking.time){ showToast("Pick a date and time first."); return; }
    const tutor = getIntroCallTutor();
    if(!tutor) return;
    const date = introBooking.date, time = introBooking.time;
    STATE.sessions.push({
      id: uid("sess"), tutorId: tutor.id, studentId: null,
      leadName: name, leadEmail: email,
      date, startTime: time, duration: 30, status: "upcoming", type: "intro", seen: false, notes: ""
    });
    await saveState();
    introConfirmation = { name, email, date, time, tutorName: tutor.name };
    introBooking = { name: "", email: "", date: "", time: "" };
    showToast(`Booked — ${fmtDateNice(date)} at ${fmtTimeNice(time)} with ${tutor.name}`);
    render();
  };
  wireStudentLoginBox();
  wireParentLoginBox();
}

/* ============================= PARENT DASHBOARD ============================= */
const PARENT_TABS = [
  {id:"sessions", label:"Sessions"},
  {id:"invoices", label:"Invoices"},
  {id:"notes", label:"Session Notes"},
  {id:"messages", label:"Messages"},
];
function getParentUnreadCount(parentId){
  return STATE.messages.filter(m=>m.parentId===parentId && m.fromRole==="staff" && !m.readByParent).length;
}
function getStaffUnreadCount(){
  return STATE.messages.filter(m=>m.fromRole==="parent" && !m.readByStaff).length;
}

function renderParentDashboard(){
  const parent = STATE.parents.find(p=>p.id===loggedInParentId);
  if(!parent){ loggedInParentId = null; render(); return ""; }
  const myStudents = (parent.studentIds||[]).map(id=>STATE.students.find(s=>s.id===id)).filter(Boolean);

  let html = `<div class="tab-panel">`;
  html += `<div class="greet-row"><h2>Hi, ${escapeHtml(parent.name)}</h2><button class="icon-btn" id="plogout-btn">Sign out</button></div>`;

  if(myStudents.length===0){
    html += `<div class="empty"><div class="display">No students linked yet</div><p>Ask your tutor to link a student to your account.</p></div></div>`;
    return html;
  }
  if(!parentSel.studentId || !myStudents.some(s=>s.id===parentSel.studentId)){
    parentSel.studentId = myStudents[0].id;
  }
  const student = myStudents.find(s=>s.id===parentSel.studentId);

  if(myStudents.length>1){
    html += `<div style="margin-bottom:16px;">${myStudents.map(s=>`<button class="btn btn-sm ${s.id===parentSel.studentId?"btn-primary":"btn-ghost"}" data-action="pick-parent-student" data-id="${s.id}" style="margin-right:6px;">${escapeHtml(s.name)}</button>`).join("")}</div>`;
  }

  html += `<div class="tabs">`;
  PARENT_TABS.forEach(t=>{
    let label = t.label;
    if(t.id==="messages") label += tabBadgeHTML(getParentUnreadCount(parent.id));
    html += `<button class="tab ${parentSel.tab===t.id?"active":""}" data-ptab="${t.id}">${label}</button>`;
  });
  html += `</div><div class="tab-panel" style="box-shadow:none;border:1px solid var(--line);">`;
  if(parentSel.tab==="sessions") html += renderParentSessionsView(student);
  if(parentSel.tab==="invoices") html += renderParentInvoicesView(student);
  if(parentSel.tab==="notes") html += renderParentNotesView(student);
  if(parentSel.tab==="messages") html += renderParentMessagesView(parent);
  html += `</div>`;

  html += `</div>`;
  return html;
}

function renderParentSessionsView(student){
  const links = student.tutors || [];
  const myTutors = links.map(l=>({ link:l, tutor: STATE.tutors.find(t=>t.id===l.tutorId) })).filter(x=>x.tutor);
  const mySessions = STATE.sessions.filter(s=>s.studentId===student.id);
  const upcoming = mySessions.filter(s=>s.status==="upcoming").sort((a,b)=>(a.date+a.startTime).localeCompare(b.date+b.startTime));

  let html = `<div class="section-title"><h2 style="font-size:16px;">Upcoming sessions</h2></div>`;
  if(upcoming.length===0){
    html += `<p class="muted">Nothing booked yet — pick a time below.</p>`;
  }else{
    upcoming.forEach(s=>{ html += studentSessionCard(s, student); });
  }

  html += `<div class="section-title" style="margin-top:22px;"><h2 style="font-size:16px;">Book a session</h2></div>`;
  if(myTutors.length===0){
    html += `<p class="muted">${escapeHtml(student.name)} isn't linked to a tutor yet — ask your tutor to add one under Manage → Students.</p>`;
  }else{
    html += `<div class="field"><label>Tutor</label>
      <select id="parent-pick-tutor">
        <option value="">Select a tutor…</option>
        ${myTutors.map(x=>`<option value="${x.tutor.id}" ${x.tutor.id===bookFlow.tutorId?"selected":""}>${escapeHtml(x.tutor.name)}${x.tutor.subjects?" — "+escapeHtml(x.tutor.subjects):""}</option>`).join("")}
      </select></div>`;
    const tutor = STATE.tutors.find(t=>t.id===bookFlow.tutorId);
    if(tutor){
      const len = tutor.slotLength || 60;
      const times = bookFlow.date ? getTimesForDate(tutor, bookFlow.date, len) : [];
      html += `<div class="grid-2">
        <div class="field"><label>Date</label><input type="date" id="parent-pick-date" min="${toDateStr(new Date())}" max="${maxBookingDateStr()}" value="${escapeHtml(bookFlow.date)}"></div>
        <div class="field"><label>Time</label>
          <select id="parent-pick-time" ${!bookFlow.date?"disabled":""}>
            <option value="">${!bookFlow.date ? "Pick a date first" : (times.length ? "Select a time…" : "No times that day")}</option>
            ${times.map(t=>`<option value="${t}" ${t===bookFlow.time?"selected":""}>${fmtTimeNice(t)}</option>`).join("")}
          </select>
        </div>
      </div>
      <button class="btn btn-primary" id="parent-book-btn" style="width:100%;" ${!bookFlow.date||!bookFlow.time?"disabled":""}>Book session</button>`;
    }
  }
  return html;
}

function renderParentInvoicesView(student){
  const invoices = STATE.invoices.filter(iv=>iv.studentId===student.id).sort((a,b)=>b.month.localeCompare(a.month));
  let html = `<div class="section-title"><h2 style="font-size:16px;">Invoices</h2></div>`;
  if(invoices.length===0){
    html += `<p class="muted">No invoices generated yet.</p>`;
    return html;
  }
  const selected = invoices.find(iv=>iv.id===parentSel.invoiceId) || invoices[0];
  html += `<div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;">`;
  invoices.forEach(iv=>{
    const monthLabel = new Date(iv.month+"-01T00:00:00").toLocaleDateString(undefined,{month:'long',year:'numeric'});
    html += `<button class="btn btn-sm ${iv.id===selected.id?"btn-primary":"btn-ghost"}" data-action="pick-invoice" data-id="${iv.id}">${monthLabel} · $${iv.total.toFixed(2)}</button>`;
  });
  html += `</div>`;
  html += buildCombinedInvoiceHTML({ number: selected.number, student, month: selected.month, tutorBlocks: selected.tutorBlocks, total: selected.total, generatedAt: selected.generatedAt }, false);
  html += `<div class="invoice-actions"><button class="btn btn-primary btn-sm" data-action="parent-print-invoice">Print / Save as PDF</button></div>`;
  return html;
}

function renderParentNotesView(student){
  const notes = STATE.sessions.filter(s=>s.studentId===student.id && s.status==="completed" && s.notes && s.notes.trim())
    .sort((a,b)=>(b.date+b.startTime).localeCompare(a.date+a.startTime));
  let html = `<div class="section-title"><h2 style="font-size:16px;">Session notes</h2></div>`;
  if(notes.length===0){
    html += `<p class="muted">No session notes yet — they'll show up here once your tutor writes one for a completed session.</p>`;
    return html;
  }
  notes.forEach(s=>{
    const tutor = STATE.tutors.find(t=>t.id===s.tutorId);
    html += `<div class="card">
      <div class="card-row">
        <div style="font-weight:600;">${tutor?escapeHtml(tutor.name):"—"}</div>
        <span class="mono muted">${fmtDateNice(s.date)} · ${fmtTimeNice(s.startTime)}</span>
      </div>
      <p style="margin:10px 0 0;white-space:pre-wrap;">${escapeHtml(s.notes)}</p>
    </div>`;
  });
  return html;
}

function renderParentMessagesView(parent){
  const thread = STATE.messages.filter(m=>m.parentId===parent.id).sort((a,b)=>a.createdAt.localeCompare(b.createdAt));
  let html = `<div class="section-title"><h2 style="font-size:16px;">Messages</h2></div>`;
  if(thread.length===0){
    html += `<p class="muted">No messages yet — send a note below and your tutor will see it.</p>`;
  }else{
    html += `<div class="msg-thread">`;
    thread.forEach(m=>{
      html += `<div class="msg-bubble ${m.fromRole==='parent'?'msg-mine':'msg-theirs'}">
        <div class="msg-meta">${m.fromRole==='parent'?'You':escapeHtml(STATE.settings.businessName)} · ${fmtMsgTime(m.createdAt)}</div>
        <div class="msg-body">${escapeHtml(m.body)}</div>
      </div>`;
    });
    html += `</div>`;
  }
  html += `<div class="field" style="margin-top:14px;margin-bottom:8px;"><label>Send a message</label><textarea id="parent-msg-text" rows="2" placeholder="Type a message to your tutor…"></textarea></div>
    <button class="btn btn-primary btn-sm" id="parent-msg-send">Send</button>`;
  return html;
}

function wireParentDashboard(){
  const logoutBtn = document.getElementById("plogout-btn");
  if(logoutBtn) logoutBtn.onclick = ()=>{ loggedInParentId = null; render(); };
  document.querySelectorAll('[data-action="pick-parent-student"]').forEach(el=>{
    el.onclick = ()=>{ parentSel.studentId = el.dataset.id; parentSel.invoiceId = null; bookFlow = { tutorId: null, date: "", time: "" }; render(); };
  });
  document.querySelectorAll('[data-ptab]').forEach(el=>{
    el.onclick = ()=>{
      parentSel.tab = el.dataset.ptab;
      if(parentSel.tab==="messages"){
        const unread = STATE.messages.filter(m=>m.parentId===loggedInParentId && m.fromRole==="staff" && !m.readByParent);
        if(unread.length){ unread.forEach(m=>{ m.readByParent = true; }); saveState(); }
      }
      render();
    };
  });
  const msgSendBtn = document.getElementById("parent-msg-send");
  if(msgSendBtn) msgSendBtn.onclick = async ()=>{
    const textEl = document.getElementById("parent-msg-text");
    const text = textEl.value.trim();
    if(!text) return;
    STATE.messages.push({ id: uid("msg"), parentId: loggedInParentId, fromRole: "parent", body: text,
      createdAt: new Date().toISOString(), readByStaff: false, readByParent: true });
    await saveState();
    render();
  };
  const tSel = document.getElementById("parent-pick-tutor");
  if(tSel) tSel.onchange = ()=>{ bookFlow.tutorId = tSel.value || null; bookFlow.date = ""; bookFlow.time = ""; render(); };
  const pDateEl = document.getElementById("parent-pick-date");
  if(pDateEl) pDateEl.addEventListener("change", ()=>{ bookFlow.date = pDateEl.value; bookFlow.time = ""; render(); });
  const pTimeEl = document.getElementById("parent-pick-time");
  if(pTimeEl) pTimeEl.addEventListener("change", ()=>{ bookFlow.time = pTimeEl.value; render(); });
  const pBookBtn = document.getElementById("parent-book-btn");
  if(pBookBtn) pBookBtn.onclick = async ()=>{
    const tutor = STATE.tutors.find(t=>t.id===bookFlow.tutorId);
    const student = STATE.students.find(s=>s.id===parentSel.studentId);
    const date = bookFlow.date, time = bookFlow.time;
    STATE.sessions.push({
      id: uid("sess"), tutorId: tutor.id, studentId: student.id,
      date, startTime: time, duration: tutor.slotLength || 60, status: "upcoming", notes: ""
    });
    await saveState();
    showToast(`Booked — ${fmtDateNice(date)} at ${fmtTimeNice(time)} with ${tutor.name}`);
    bookFlow = { tutorId: null, date: "", time: "" };
    render();
  };
  document.querySelectorAll('[data-action="student-cancel"]').forEach(el=>{
    el.onclick = ()=>{
      showConfirmModal("Cancel this session?", async ()=>{
        const s = STATE.sessions.find(x=>x.id===el.dataset.id);
        if(s){ s.status = "cancelled"; await saveState(); render(); }
      });
    };
  });
  document.querySelectorAll('[data-action="pick-invoice"]').forEach(el=>{
    el.onclick = ()=>{ parentSel.invoiceId = el.dataset.id; render(); };
  });
  const printBtn = document.querySelector('[data-action="parent-print-invoice"]');
  if(printBtn) printBtn.onclick = ()=>{
    document.querySelectorAll('.invoice-doc').forEach(doc=>doc.classList.add('print-active'));
    window.print();
  };
}

  {id:"sessions", label:"Sessions"},
  {id:"tutors", label:"Tutors"},
  {id:"students", label:"Students"},
  {id:"parents", label:"Parents"},
  {id:"messages", label:"Messages"},

];

function getUnseenIntroCount(){
  return STATE.sessions.filter(s=>s.type==="intro" && s.status==="upcoming" && !s.seen).length;
}
function tabBadgeHTML(count){
  return count>0 ? ` <span class="badge cancelled" style="margin-left:4px;">${count}</span>` : "";
}
function renderAdminShell(){
  let html = `<div class="tabs">`;
  ADMIN_TABS.forEach(t=>{
    let label = t.label;
    if(t.id==="sessions") label += tabBadgeHTML(getUnseenIntroCount());
    if(t.id==="messages") label += tabBadgeHTML(getStaffUnreadCount());
    html += `<button class="tab ${currentTab===t.id?"active":""}" data-tab="${t.id}">${label}</button>`;
  });
  html += `</div><div class="tab-panel">`;
  if(currentTab==="sessions") html += renderSessionsTab();
  if(currentTab==="tutors") html += renderTutorsTab();
  if(currentTab==="students") html += renderStudentsTab();
  if(currentTab==="parents") html += renderParentAccountsTab();
  if(currentTab==="messages") html += renderMessagesTab();
  if(currentTab==="invoices") html += renderInvoicesTab();
  if(currentTab==="settings") html += renderSettingsTab();
  html += `</div>`;
  return html;
}
function wireAdminShell(){
  document.querySelectorAll(".tab").forEach(btn=>{ btn.onclick = ()=>{ currentTab = btn.dataset.tab; render(); }; });
  if(currentTab==="sessions") wireSessionsTab();
  if(currentTab==="tutors") wireTutorsTab();
  if(currentTab==="students") wireStudentsTab();
  if(currentTab==="parents") wireParentAccountsTab();
  if(currentTab==="messages") wireMessagesTab();
  if(currentTab==="invoices") wireInvoicesTab();
  if(currentTab==="settings") wireSettingsTab();
}

/* ---------- SESSIONS TAB ---------- */
let staffBook = { studentId: "", tutorId: "", date: "", time: "" };

function renderSessionsTab(){
  const sessions = [...STATE.sessions].filter(s=>s.type!=="intro").sort((a,b)=> (a.date+a.startTime).localeCompare(b.date+b.startTime));
  const upcoming = sessions.filter(s=>s.status==="upcoming");
  const past = sessions.filter(s=>s.status!=="upcoming");

  const introCalls = [...STATE.sessions].filter(s=>s.type==="intro").sort((a,b)=> (a.date+a.startTime).localeCompare(b.date+b.startTime));
  const introUpcoming = introCalls.filter(s=>s.status==="upcoming");
  const introPast = introCalls.filter(s=>s.status!=="upcoming");

  let html = "";
  if(introUpcoming.length || introPast.length){
    html += `<div class="section-title"><h2>Informational Session requests</h2><span class="muted">${introUpcoming.length} upcoming</span></div>`;
    if(introUpcoming.length===0){
      html += `<p class="muted">No upcoming Informational Sessions.</p>`;
    }else{
      introUpcoming.forEach(s=>{ html += introCallCard(s); });
    }
    if(introPast.length){
      introPast.slice().reverse().slice(0,15).forEach(s=>{ html += introCallCard(s); });
    }
  }

  html += `<div class="section-title" style="margin-top:${introUpcoming.length||introPast.length?"30px":"0"};"><h2>Book a session</h2></div>`;
  html += `<div class="form-box">`;
  if(STATE.students.length===0){
    html += `<p class="muted">Add a student first under Manage → Students.</p>`;
  }else{
    html += `<div class="grid-2">
      <div class="field"><label>Student</label>
        <select id="staff-book-student">
          <option value="">Select a student…</option>
          ${STATE.students.map(s=>`<option value="${s.id}" ${s.id===staffBook.studentId?"selected":""}>${escapeHtml(s.name)}</option>`).join("")}
        </select>
      </div>
      <div class="field"><label>Tutor</label>
        <select id="staff-book-tutor" ${!staffBook.studentId?"disabled":""}>
          <option value="">Select a tutor…</option>
          ${(()=>{
            const student = STATE.students.find(s=>s.id===staffBook.studentId);
            if(!student) return "";
            return (student.tutors||[]).map(l=>{
              const t = STATE.tutors.find(t=>t.id===l.tutorId);
              return t ? `<option value="${t.id}" ${t.id===staffBook.tutorId?"selected":""}>${escapeHtml(t.name)}</option>` : "";
            }).join("");
          })()}
        </select>
      </div>
    </div>`;
    const tutor = STATE.tutors.find(t=>t.id===staffBook.tutorId);
    if(tutor){
      const len = tutor.slotLength || 60;
      const times = staffBook.date ? getTimesForDate(tutor, staffBook.date, len) : [];
      html += `<div class="grid-2">
        <div class="field"><label>Date</label><input type="date" id="staff-book-date" min="${toDateStr(new Date())}" max="${maxBookingDateStr()}" value="${escapeHtml(staffBook.date)}"></div>
        <div class="field"><label>Time</label>
          <select id="staff-book-time" ${!staffBook.date?"disabled":""}>
            <option value="">${!staffBook.date ? "Pick a date first" : (times.length ? "Select a time…" : "No times that day")}</option>
            ${times.map(t=>`<option value="${t}" ${t===staffBook.time?"selected":""}>${fmtTimeNice(t)}</option>`).join("")}
          </select>
        </div>
      </div>
      <button class="btn btn-primary" id="staff-book-btn" ${!staffBook.date||!staffBook.time?"disabled":""}>Book session</button>`;
    }
  }
  html += `</div>`;

  html += `<div class="section-title"><h2>Upcoming sessions</h2><span class="muted">${upcoming.length} scheduled</span></div>`;
  if(upcoming.length===0){
    html += `<div class="empty"><div class="display">Nothing on the books</div><p>Once a student books, it'll show up here.</p></div>`;
  }else{
    upcoming.forEach(s=>{ html += sessionCard(s); });
  }
  if(past.length){
    html += `<div class="section-title" style="margin-top:26px;"><h2>Past sessions</h2></div>`;
    past.slice().reverse().slice(0,25).forEach(s=>{ html += sessionCard(s); });
  }
  return html;
}
function buildMailto(email, subject, body){
  return `mailto:${encodeURIComponent(email)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
}

function sessionCard(s){

function wireSessionsTab(){
  const unseenIntros = STATE.sessions.filter(s=>s.type==="intro" && s.status==="upcoming" && !s.seen);
  if(unseenIntros.length){
    unseenIntros.forEach(s=>{ s.seen = true; });
    saveState();
    render();
    return;
  }
  const studentSel = document.getElementById("staff-book-student");
  if(studentSel) studentSel.onchange = ()=>{ staffBook.studentId = studentSel.value; staffBook.tutorId = ""; staffBook.date = ""; staffBook.time = ""; render(); };
  const tutorSel = document.getElementById("staff-book-tutor");
  if(tutorSel) tutorSel.onchange = ()=>{ staffBook.tutorId = tutorSel.value; staffBook.date = ""; staffBook.time = ""; render(); };
  const sDateEl = document.getElementById("staff-book-date");
  if(sDateEl) sDateEl.addEventListener("change", ()=>{ staffBook.date = sDateEl.value; staffBook.time = ""; render(); });
  const sTimeEl = document.getElementById("staff-book-time");
  if(sTimeEl) sTimeEl.addEventListener("change", ()=>{ staffBook.time = sTimeEl.value; render(); });
  const sBookBtn = document.getElementById("staff-book-btn");
  if(sBookBtn) sBookBtn.onclick = async ()=>{
    const tutor = STATE.tutors.find(t=>t.id===staffBook.tutorId);
    const student = STATE.students.find(s=>s.id===staffBook.studentId);
    const date = staffBook.date, time = staffBook.time;
    STATE.sessions.push({
      id: uid("sess"), tutorId: tutor.id, studentId: student.id,
      date, startTime: time, duration: tutor.slotLength || 60, status: "upcoming", notes: ""
    });
    await saveState();
    showToast(`Booked ${student.name} — ${fmtDateNice(date)} at ${fmtTimeNice(time)} with ${tutor.name}`);
    staffBook = { studentId: "", tutorId: "", date: "", time: "" };
    render();
  };
  document.querySelectorAll('[data-action]').forEach(el=>{
    el.onclick = async ()=>{
      const id = el.dataset.id;
      const s = STATE.sessions.find(x=>x.id===id);
      if(!s) return;
      const action = el.dataset.action;
      if(action==="complete"){ s.status="completed"; await saveState(); showToast("Marked completed."); render(); }
      if(action==="cancel"){ s.status="cancelled"; await saveState(); showToast("Session cancelled."); render(); }
      if(action==="delete"){ STATE.sessions = STATE.sessions.filter(x=>x.id!==id); await saveState(); showToast("Record deleted."); render(); }
      if(action==="save-notes"){ s.notes = document.getElementById(`notes-${id}`).value; await saveState(); showToast("Notes saved."); }
    };
  });
}

function wireTutorsTab(){
  const addBtn = document.getElementById("add-tutor-btn");
  if(addBtn) addBtn.onclick = async ()=>{
    const name = document.getElementById("nt-name").value.trim();
    if(!name){ showToast("Give the tutor a name first."); return; }
    STATE.tutors.push({ id: uid("tutor"), name, subjects: document.getElementById("nt-subjects").value.trim(),
      slotLength: parseInt(document.getElementById("nt-length").value) || 60,
      paymentInfo: document.getElementById("nt-payment").value.trim(), availability: [] });
    await saveState(); showToast("Tutor added."); render();
  };
  document.querySelectorAll('[data-action="save-payment"]').forEach(el=>{
    el.onclick = async ()=>{
      const t = STATE.tutors.find(x=>x.id===el.dataset.id);
      t.paymentInfo = document.getElementById(`pay-${el.dataset.id}`).value.trim();
      await saveState(); showToast("Payment info saved.");
    };
  });
  document.querySelectorAll('[data-action="del-tutor"]').forEach(el=>{
    el.onclick = ()=>{
      showConfirmModal("Remove this tutor? Students linked to them will keep their history but lose that link.", async ()=>{
        STATE.tutors = STATE.tutors.filter(t=>t.id!==el.dataset.id);
        STATE.students.forEach(s=>{ s.tutors = (s.tutors||[]).filter(l=>l.tutorId!==el.dataset.id); });
        await saveState(); render();
      });
    };
  });
  document.querySelectorAll('[data-action="add-avail"]').forEach(el=>{
    el.onclick = async ()=>{
      const id = el.dataset.id;
      const t = STATE.tutors.find(x=>x.id===id);
      const day = parseInt(document.getElementById(`av-day-${id}`).value);
      const start = document.getElementById(`av-start-${id}`).value;
      const end = document.getElementById(`av-end-${id}`).value;
      if(!start || !end || start>=end){ showToast("Check the start/end times."); return; }
      t.availability = t.availability || [];
      t.availability.push({day, start, end});
      await saveState(); showToast("Availability added."); render();
    };
  });
  document.querySelectorAll('[data-action="del-avail"]').forEach(el=>{
    el.onclick = async ()=>{
      const t = STATE.tutors.find(x=>x.id===el.dataset.id);
      t.availability.splice(parseInt(el.dataset.idx),1);
      await saveState(); render();
    };
  });
}

/* ---------- INVOICES TAB ---------- */
function computeCombinedInvoiceBlocks(studentId, month){
  const student = STATE.students.find(s=>s.id===studentId);
  const links = student ? (student.tutors||[]) : [];
  const blocks = links.map(link=>{
    const tutor = STATE.tutors.find(t=>t.id===link.tutorId);
    if(!tutor) return null;
    const lineItems = computeLineItems(studentId, tutor.id, month);
    if(lineItems.length===0) return null;
    return { tutorId: tutor.id, tutorName: tutor.name, lineItems, subtotal: lineItems.reduce((sum,li)=>sum+li.amount,0) };
  }).filter(Boolean);
  blocks.sort((a,b)=>b.lineItems.length-a.lineItems.length);
  return blocks;
}
function computeLineItems(studentId, tutorId, month){
  const student = STATE.students.find(s=>s.id===studentId);
  const sessions = STATE.sessions.filter(s=> s.studentId===studentId && s.tutorId===tutorId && s.status==="completed" && s.date.slice(0,7)===month)
    .sort((a,b)=>a.date.localeCompare(b.date));
  return sessions.map(s=>{
    const tutor = STATE.tutors.find(t=>t.id===s.tutorId);
    const link = getLink(student, s.tutorId);
    const rate = link ? (link.rate||0) : 0;
    const amount = (s.duration/60) * rate;
    return {
      date: s.date,
      item: `${s.duration} min. Individual Tutoring Session (Virtual)`,
      tutorId: s.tutorId,
      tutorName: tutor ? tutor.name : "\u2014",
      rate, amount
    };
  });
}

function buildCombinedInvoiceHTML(inv, isDraft){
  const monthLabel = new Date(inv.month+"-01T00:00:00").toLocaleDateString(undefined,{month:'long', year:'numeric'});
  const blocks = inv.tutorBlocks || [];

  const blocksHTML = blocks.length ? blocks.map(block=>{
    const rows = block.lineItems.map(li=>`
      <tr><td>${fmtDateSlash(li.date)}</td><td>${escapeHtml(li.item)}</td><td>$${li.rate.toFixed(2)}</td><td>$${li.amount.toFixed(2)}</td></tr>
    `).join("");
    const tutor = STATE.tutors.find(t=>t.id===block.tutorId);
    const paymentHTML = (tutor && tutor.paymentInfo) ? `
      <div class="invoice-payment">
        <span class="lbl">Payment Method (${escapeHtml(block.tutorName)}):</span>
        <div>${escapeHtml(tutor.paymentInfo)}</div>
      </div>` : "";
    return `
      <div class="day-heading">${escapeHtml(block.tutorName)} — ${block.lineItems.length} session${block.lineItems.length===1?"":"s"}</div>
      <table class="invoice-items">
        <thead><tr><th>Date</th><th>Item</th><th>Rate/hour</th><th>Amount</th></tr></thead>
        <tbody>${rows}</tbody>
        <tfoot><tr class="invoice-total-row"><td colspan="3">Subtotal</td><td>$${block.subtotal.toFixed(2)}</td></tr></tfoot>
      </table>
      ${paymentHTML}
    `;
  }).join("") : `<p class="muted" style="text-align:center;margin:20px 0;">No completed sessions in ${monthLabel}.</p>`;

  const billName = (inv.student.billToName && inv.student.billToName.trim()) || inv.student.name;

  return `<div class="invoice-doc">
    <div class="invoice-top">
      <div class="invoice-logo"><img src="${document.querySelector('.topbar .site-logo') ? document.querySelector('.topbar .site-logo').src : ''}" alt="${escapeHtml(STATE.settings.businessName)}"><div class="site-lines">${STATE.settings.website?`<div>${escapeHtml(STATE.settings.website)}</div>`:""}${STATE.settings.invoiceEmail?`<div>${escapeHtml(STATE.settings.invoiceEmail)}</div>`:""}</div></div>
      <div class="invoice-title">
        <h2>Invoice</h2>
        <div class="num">${inv.number ? "#"+inv.number : "DRAFT"}${isDraft?'<span class="draft-flag">NOT SAVED</span>':''}</div>
        <div class="balance-box"><div class="lbl">Balance Due</div><div class="amt">$${inv.total.toFixed(2)}</div></div>
      </div>
    </div>
    <div class="invoice-meta">
      <div class="bill-to"><div class="lbl">Bill To</div><div class="name">${escapeHtml(billName)}</div></div>
      <table class="meta-table"><tbody>
        <tr><td>Invoice Date:</td><td>${fmtDateSlash(inv.generatedAt)}</td></tr>
        <tr><td>Terms:</td><td>${escapeHtml(STATE.settings.terms)}</td></tr>
        <tr><td>Due Date:</td><td>${fmtDateSlash(inv.generatedAt)}</td></tr>
      </tbody></table>
    </div>
    ${blocksHTML}
    <div class="invoice-due-row"><span>Balance Due</span><span>$${inv.total.toFixed(2)}</span></div>
  </div>`;
}

function wireInvoicesTab(){
  const studentSel = document.getElementById("inv-student");
  if(studentSel) studentSel.onchange = ()=>{ invoiceSel.studentId = studentSel.value; render(); };
  const monthInput = document.getElementById("inv-month");
  if(monthInput) monthInput.onchange = ()=>{ invoiceSel.month = monthInput.value; render(); };

  document.querySelectorAll('[data-action="print-invoice"]').forEach(el=>{
    el.onclick = ()=>{
      document.querySelectorAll('.invoice-doc').forEach(doc=>doc.classList.add('print-active'));
      window.print();
    };
  });

  document.querySelectorAll('[data-action="generate-invoice"]').forEach(el=>{
    el.onclick = async ()=>{
      const tutorBlocks = computeCombinedInvoiceBlocks(invoiceSel.studentId, invoiceSel.month);
      const total = tutorBlocks.reduce((sum,b)=>sum+b.subtotal,0);
      const number = STATE.settings.nextInvoiceNumber;
      STATE.invoices.push({ id: uid("inv"), number, studentId: invoiceSel.studentId, month: invoiceSel.month,
        generatedAt: toDateStr(new Date()), tutorBlocks, total });
      STATE.settings.nextInvoiceNumber = number + 1;
      await saveState(); showToast(`Invoice #${number} saved.`); render();
    };
  });
  document.querySelectorAll('[data-action="regenerate-invoice"]').forEach(el=>{
    el.onclick = ()=>{
      showConfirmModal("Overwrite the saved invoice with a fresh calculation from current sessions?", async ()=>{
        const existing = STATE.invoices.find(iv=>iv.studentId===invoiceSel.studentId && iv.month===invoiceSel.month);
        existing.tutorBlocks = computeCombinedInvoiceBlocks(invoiceSel.studentId, invoiceSel.month);
        existing.total = existing.tutorBlocks.reduce((sum,b)=>sum+b.subtotal,0);
        existing.generatedAt = toDateStr(new Date());
        await saveState(); showToast("Invoice updated."); render();
      });
    };
  });
  document.querySelectorAll('[data-action="view-invoice"]').forEach(el=>{
    el.onclick = ()=>{ invoiceSel.studentId = el.dataset.student; invoiceSel.month = el.dataset.month; render(); window.scrollTo({top:0,behavior:'smooth'}); };
  });
}

/* ---------- SETTINGS TAB ---------- */
function renderSettingsTab(){
  return `<div class="section-title"><h2>Settings</h2></div>
    <div class="grid-2">
      <div class="field"><label>Business name</label><input id="set-bizname" value="${escapeHtml(STATE.settings.businessName)}"></div>
      <div class="field"><label>Website (shown on invoices)</label><input id="set-website" value="${escapeHtml(STATE.settings.website||"")}"></div>
    </div>
    <div class="grid-2">
      <div class="field"><label>Contact email (shown on invoices)</label><input id="set-email" value="${escapeHtml(STATE.settings.invoiceEmail)}"></div>
      <div class="field"><label>Invoice terms</label><input id="set-terms" value="${escapeHtml(STATE.settings.terms)}"></div>
    </div>
    <div class="field" style="max-width:240px;"><label>Next invoice number</label><input id="set-nextnum" type="number" value="${STATE.settings.nextInvoiceNumber}"></div>
    <p class="muted" style="margin-top:-6px;margin-bottom:14px;">Payment info (Zelle, etc.) is set per tutor now, under Manage → Tutors — each invoice automatically shows the payment info for whichever tutor(s) worked those sessions.</p>
    <div class="field" style="max-width:280px;"><label>Informational Session tutor</label>
      <select id="set-introtutor">
        <option value="">None (hide the booking widget)</option>
        ${STATE.tutors.map(t=>`<option value="${t.id}" ${t.id===STATE.settings.introTutorId?"selected":""}>${escapeHtml(t.name)}</option>`).join("")}
      </select>
    </div>
    <p class="muted" style="margin-top:-6px;margin-bottom:14px;">This tutor's availability is used for the free 30-minute Informational Session widget on the sign-in page.</p>
    <button class="btn btn-primary" id="save-settings">Save</button>
    <div class="card danger" style="margin-top:26px;">
      <div style="font-weight:600;margin-bottom:6px;">Reset all data</div>
      <p class="muted" style="margin-bottom:10px;">Clears every tutor, student, session, and invoice. This can't be undone.</p>
      <button class="btn btn-danger btn-sm" id="reset-all">Clear everything</button>
    </div>
    <p class="muted" style="margin-top:18px;">Staff PIN is set in the code (search for ADMIN_PIN) — a simple shared gate, not real login security.</p>`;
}
function wireSettingsTab(){
  document.getElementById("save-settings").onclick = async ()=>{
    STATE.settings.businessName = document.getElementById("set-bizname").value.trim() || "MJA Tutoring";
    STATE.settings.website = document.getElementById("set-website").value.trim();
    STATE.settings.invoiceEmail = document.getElementById("set-email").value.trim();
    STATE.settings.terms = document.getElementById("set-terms").value.trim() || "Due on Receipt";
    STATE.settings.nextInvoiceNumber = parseInt(document.getElementById("set-nextnum").value) || STATE.settings.nextInvoiceNumber;
    STATE.settings.introTutorId = document.getElementById("set-introtutor").value;
    await saveState(); showToast("Saved.");
  };
  document.getElementById("reset-all").onclick = ()=>{
    showConfirmModal("This deletes everything for everyone using this portal. Are you sure?", async ()=>{
      STATE = defaultState();
      await saveState(); showToast("All data cleared."); render();
    });
  };
}

/* ============================= UTIL ============================= */
function escapeHtml(str){
  if(!str) return "";
  return String(str).replace(/[&<>"']/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}

/* ============================= INIT ============================= */
startStateSync();
